  - id: D62
    question: "For won deals, how does the average funding cost we charged compare to the average treasury benchmark funding cost, by customer region and currency?"
    domain: treasury
    persona: cfo
    difficulty: multi-table-join
    note: >-
      New pairing: historical_deals + customer_master + treasury_rate_sheet together.
      D58 joined deals to the rate sheet alone (no customer); D59-D61 joined deals to
      customer/product but never to the rate sheet. region comes from customer_master,
      the benchmark funding_cost_pct from treasury_rate_sheet on the compound key
      currency+tenor — both joins are required, no view exposes region alongside the
      rate-sheet's funding cost.
    gold_sql: >
      SELECT cm.region, hd.currency,
             ROUND(AVG(hd.funding_cost_pct), 2) AS avg_charged_funding_cost_pct,
             ROUND(AVG(trs.funding_cost_pct), 2) AS avg_benchmark_funding_cost_pct
