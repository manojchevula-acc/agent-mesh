  - id: D21
    question: "For won deals, how many were booked per product and what was the average margin on each?"
    domain: product
    persona: pricing-desk
    difficulty: join-aggregate
    note: >-
      product_NAME lives only on product_master; the deal grain only carries product_id — the join is mandatory, not cosmetic.
    gold_sql: >
      SELECT pm.product_name, COUNT(hd.deal_id) AS deal_count, ROUND(AVG(hd.expected_margin_pct),
             2) AS avg_margin_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.deal_outcome = 'Won'
      GROUP BY pm.product_name
      ORDER BY deal_count DESC
    gold_tables: [historical_deals, product_master]
    gold_columns: [product_name, deal_id, expected_margin_pct, product_id, deal_outcome]
