  - id: D61
    question: "For won deals, what is the average ticket-size utilisation (the requested amount as a percentage of the product's maximum ticket size) by customer region and product?"
    domain: product
    persona: cfo
    difficulty: multi-table-join
    note: >-
      A three-table base join (historical_deals + customer_master + product_master). The metric
      needs max_ticket_size, which lives on product_master ONLY — no semantic view carries it,
      and a fab_semantic view may only be joined to customer_master (validator check #9), never
      to product_master — so the whole query is forced into the base tables: requested_amount
      from historical_deals, region from customer_master, max_ticket_size from product_master.
      There is no single-view shortcut. (An earlier version compared expected margin to the
      policy floor, but pricing_recommendation_view exposes both policy_min_margin_pct and
      product_name, so a correct agent could answer it from that one view with no join.)
    gold_sql: >
      SELECT cm.region, pm.product_name,
             ROUND(AVG(hd.requested_amount * 100.0 / pm.max_ticket_size), 2) AS avg_ticket_utilisation_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.deal_outcome = 'Won'
      GROUP BY cm.region, pm.product_name
      ORDER BY avg_ticket_utilisation_pct DESC
      LIMIT 50
    gold_tables: [historical_deals, customer_master, product_master]
    gold_columns: [customer_id, deal_outcome, max_ticket_size, product_id, product_name, region, requested_amount]
    row_count: 22
    gold_result:
      - {region: Abu Dhabi, product_name: Working Capital Loan, avg_ticket_utilisation_pct: 81.07}
      - {region: Ras Al Khaimah, product_name: Corporate Deposit, avg_ticket_utilisation_pct: 80.8}
