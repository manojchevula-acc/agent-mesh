  - id: D68
    question: "For won deals on products eligible for both Corporate and SME segments, how many deals came from each segment, by product?"
    domain: product
    persona: relationship-manager
    difficulty: multi-table-join
    note: >-
      eligible_segments is a comma-delimited product_master-only column (confirmed
      absent from every view) — the note on product_master flags it as "app-side parse
      or SQL LIKE; not 1NF". 'Corporate' and 'SME' share no substring, so a plain LIKE
      has no false-negative risk here (unlike tenor codes such as '1M' inside '12M').
      (An earlier draft asked which deals VIOLATED eligible_segments, but no such deal
      exists in this dataset — empty gold — so this version uses eligible_segments as a
      product FILTER instead of a violation check, over the same three-table join.)
    gold_sql: >
      SELECT pm.product_name, cm.customer_segment, COUNT(*) AS won_deal_count
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.deal_outcome = 'Won'
        AND pm.eligible_segments LIKE '%Corporate%' AND pm.eligible_segments LIKE '%SME%'
      GROUP BY pm.product_name, cm.customer_segment
      ORDER BY pm.product_name, cm.customer_segment
    gold_tables: [historical_deals, customer_master, product_master]
