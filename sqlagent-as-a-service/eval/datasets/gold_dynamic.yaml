  # --- FORCED MULTI-JOIN, NEW TABLE PAIRINGS (D58-D61) ----------------------
  # Every item below needs a JOIN no single view can substitute, because the
  # discriminating column lives on ONE base table only and appears on no view:
  #   * benchmark_index          -> treasury_rate_sheet ONLY (no view exposes it)
  #   * max_discount_allowed_pct -> product_master ONLY (distinct from the pricing_policy
  #                                 cap in D53 and the relationship_discount_view in D28)
  #   * min_margin_pct           -> pricing_policy ONLY, compared raw to a deal-grain fact
  # treasury_rate_sheet is joined here for the first time in the set, on its compound
  # key currency+tenor (exactly one sheet row per pair, so no fan-out).

  - id: D58
    question: "For each treasury benchmark index (EIBOR vs SOFR), how many deals were booked and what was the total requested amount?"
    domain: treasury
    persona: cfo
    difficulty: multi-table-join
    note: >-
      benchmark_index lives ONLY on treasury_rate_sheet — no view carries it — so the deal
      grain must be joined to the rate sheet on its compound key currency+tenor. Exactly one
      sheet row exists per currency+tenor, so the join does not fan out the deal count.
    gold_sql: >
      SELECT trs.benchmark_index, COUNT(*) AS deal_count,
             SUM(hd.requested_amount) AS total_requested_amount
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.treasury_rate_sheet trs ON hd.currency = trs.currency AND hd.tenor = trs.tenor
      GROUP BY trs.benchmark_index
      ORDER BY total_requested_amount DESC
    gold_tables: [historical_deals, treasury_rate_sheet]
    gold_columns: [benchmark_index, currency, requested_amount, tenor]
    row_count: 2
    gold_result:
      - {benchmark_index: EIBOR, deal_count: 47, total_requested_amount: 2195700000}
      - {benchmark_index: SOFR, deal_count: 13, total_requested_amount: 338600000}
  - id: D59
    question: "Which deals have a relationship discount above the maximum discount allowed for that product, and what are the two values?"
    domain: policy
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      max_discount_allowed_pct is the PRODUCT-level cap on product_master ONLY (not the
      pricing_policy cap used in D53, nor the relationship_discount_view cap in D28). The deal's
      relationship_discount_pct is on historical_deals — the comparison forces the product join.
    order_sensitive: true
    gold_sql: >
      SELECT hd.deal_id, pm.product_name, hd.relationship_discount_pct,
             pm.max_discount_allowed_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.relationship_discount_pct > pm.max_discount_allowed_pct
      ORDER BY hd.deal_id
    gold_tables: [historical_deals, product_master]
    gold_columns: [deal_id, max_discount_allowed_pct, product_id, product_name, relationship_discount_pct]
    row_count: 5
    gold_result:
      - {deal_id: DEAL006, product_name: Corporate Deposit, relationship_discount_pct: 0.4, max_discount_allowed_pct: 0.25}
      - {deal_id: DEAL015, product_name: Corporate Deposit, relationship_discount_pct: 0.35, max_discount_allowed_pct: 0.25}
      - {deal_id: DEAL022, product_name: Corporate Deposit, relationship_discount_pct: 0.4, max_discount_allowed_pct: 0.25}
      - {deal_id: DEAL032, product_name: Corporate Deposit, relationship_discount_pct: 0.35, max_discount_allowed_pct: 0.25}
      - {deal_id: DEAL039, product_name: Corporate Deposit, relationship_discount_pct: 0.4, max_discount_allowed_pct: 0.25}
  - id: D60
    question: "For won deals, break down the deal count, total requested volume and average expected margin by product and by treasury benchmark index (EIBOR vs SOFR)."
    domain: product
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      A three-table join across historical_deals, product_master and treasury_rate_sheet:
      product_name is on product_master ONLY and the CATEGORICAL benchmark_index (EIBOR/SOFR)
      on treasury_rate_sheet ONLY, so neither can come from a view. The question names EIBOR vs
      SOFR on purpose: without it the generator grabs the numeric benchmark_rate_pct_treasury
      column that the deal-grain views expose and skips the treasury join entirely. The rate
      sheet join is on the compound key currency+tenor.
    gold_sql: >
      SELECT pm.product_name, trs.benchmark_index, COUNT(*) AS won_deals,
             SUM(hd.requested_amount) AS won_volume_aed,
             ROUND(AVG(hd.expected_margin_pct), 2) AS avg_expected_margin_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      JOIN fab_curated.treasury_rate_sheet trs ON hd.currency = trs.currency AND hd.tenor = trs.tenor
      WHERE hd.deal_outcome = 'Won'
      GROUP BY pm.product_name, trs.benchmark_index
      ORDER BY won_volume_aed DESC
    gold_tables: [historical_deals, product_master, treasury_rate_sheet]
    gold_columns: [benchmark_index, currency, deal_outcome, expected_margin_pct, product_id, product_name, requested_amount, tenor]
