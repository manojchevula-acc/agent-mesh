  - id: D25
    question: "For the product type with the largest won volume, what is its average expected margin?"
    domain: margin
    persona: cfo
    difficulty: multi-step-subquery
    note: >-
      two steps: rank product types by won volume, THEN average margin for the winner. Must stay inside historical_deals — mixing a view with a base-table subquery trips validator check #9.
    gold_sql: >
      SELECT product_type, COUNT(*) AS won_deals, ROUND(AVG(expected_margin_pct),
             2) AS avg_expected_margin_pct
      FROM fab_curated.historical_deals
      WHERE deal_outcome = 'Won' AND product_type = ( SELECT product_type
      FROM fab_curated.historical_deals
      WHERE deal_outcome = 'Won'
      GROUP BY product_type
      ORDER BY SUM(requested_amount) DESC
      LIMIT 1)
      GROUP BY product_type
    gold_tables: [historical_deals]
    gold_columns: [product_type, expected_margin_pct, deal_outcome, requested_amount]
    row_count: 1
    gold_result:
      - {product_type: Loan, won_deals: 29, avg_expected_margin_pct: 1.86}
  - id: D26
