  - id: D69
    question: "Run an eligibility check across our won deal book: for each deal, show the region, product name, tenor booked, and whether that tenor is on the product's eligible tenor list."
    domain: compliance
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      Same product_master-only eligible_tenors column as D68's eligible_segments, but
      tenor codes like '1M' are substrings of '12M', so a naive LIKE would
      false-negative — FIND_IN_SET gives an exact comma-boundary match instead. (An
      earlier draft filtered to only the VIOLATIONS, which is empty-gold here — every
      booked tenor is already eligible — so this version audits every won deal instead
      of only the [nonexistent] breaches, over the same join.)
    order_sensitive: true
    gold_sql: >
      SELECT hd.deal_id, cm.region, pm.product_name, hd.tenor,
             CASE WHEN FIND_IN_SET(hd.tenor, pm.eligible_tenors) > 0 THEN 'Yes' ELSE 'No' END AS tenor_eligible
