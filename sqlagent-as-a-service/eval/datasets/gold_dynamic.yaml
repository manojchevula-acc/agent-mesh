      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.deal_outcome = 'Won'
      ORDER BY hd.deal_id
      LIMIT 50
