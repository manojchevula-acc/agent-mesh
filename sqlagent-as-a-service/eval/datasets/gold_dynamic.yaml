  # --- COMPLEX JOINS (D50-D57) ---------------------------------------------
  # Multi-table join questions: base<->base, view->dimension (customer_master),
  # 3-table (+pricing_policy), 4-table, and CASE/HAVING over joins. Every join pair
  # is declared in schema.yaml's relationship graph, so a correct agent can see it in
  # AVAILABLE JOINS. Dimensions chosen to be customer_master-ONLY (industry, credit_score,
  # relationship_tenure_years) so the join is genuinely required, not decorative.

  - id: D50
    question: "For each product, what is the total requested amount and the average expected margin on won deals?"
    domain: product
    persona: pricing-desk
    difficulty: join-aggregate
    gold_sql: >
      SELECT pm.product_name, SUM(hd.requested_amount) AS total_requested_amount,
             ROUND(AVG(hd.expected_margin_pct), 2) AS avg_expected_margin_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.deal_outcome = 'Won'
      GROUP BY pm.product_name
      ORDER BY total_requested_amount DESC
    gold_tables: [historical_deals, product_master]
    gold_columns: [product_name, requested_amount, expected_margin_pct, product_id, deal_outcome]
    gold_result:
      - {product_name: Corporate Deposit, total_requested_amount: 978100000, avg_expected_margin_pct: -0.45}
      - {product_name: Term Loan, total_requested_amount: 558600000, avg_expected_margin_pct: 1.91}
      - {product_name: Working Capital Loan, total_requested_amount: 287300000, avg_expected_margin_pct: 1.54}
      - {product_name: USD Term Loan, total_requested_amount: 234400000, avg_expected_margin_pct: 1.71}
      - {product_name: Trade Finance LC, total_requested_amount: 69500000, avg_expected_margin_pct: 1.1}
      - {product_name: Overdraft Facility, total_requested_amount: 67800000, avg_expected_margin_pct: 2.42}
      - {product_name: FX Forward Facility, total_requested_amount: 51000000, avg_expected_margin_pct: 1.03}
      - {product_name: Invoice Discounting, total_requested_amount: 31300000, avg_expected_margin_pct: 1.09}
    row_count: 8

  - id: D51
    question: "What is the average net margin by customer credit-score band (High >=700, Medium 600-699, Low <600)?"
    domain: margin
    persona: cfo
    difficulty: join-case-banding
    note: >-
      credit_score is on customer_master only (not on margin_analysis), so the join is required.
    gold_sql: >
      SELECT CASE WHEN cm.credit_score >= 700 THEN 'High' WHEN cm.credit_score >= 600 THEN 'Medium' ELSE 'Low' END AS credit_band,
             ROUND(AVG(ma.net_margin_pct), 2) AS avg_net_margin_pct
      FROM fab_semantic.margin_analysis ma
      JOIN fab_curated.customer_master cm ON ma.customer_id = cm.customer_id
      GROUP BY credit_band
      ORDER BY credit_band
    gold_tables: [margin_analysis, customer_master]
    gold_columns: [credit_score, net_margin_pct, customer_id]
