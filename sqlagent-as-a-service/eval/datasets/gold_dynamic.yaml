      price: reference_final_price_pct (6.55) + adjustment_for_new_customer_pct (0.35) =
      suggested_price_pct (6.90). A common failure is querying pricing_recommendation_view for
      Prime Tech's own deal price and reporting 'no data for Mira'.
    gold_sql: >
      SELECT new_customer_id, new_customer_name, reference_customer_id, reference_customer_name,
