  - id: D72
    question: "How many deals breached the PRODUCT's own maximum discount cap (not the policy cap), broken down by customer region?"
    domain: policy
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      Same historical_deals+product_master combo as D59, with customer_master added for
      the region cut. Deliberately named "the PRODUCT's own cap" to distinguish from D53,
      which breaches the POLICY cap (pricing_policy.max_relationship_discount_pct) — the
      two caps are independent columns on different tables and can disagree.
    gold_sql: >
      SELECT cm.region, COUNT(*) AS discount_breaches
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.relationship_discount_pct > pm.max_discount_allowed_pct
      GROUP BY cm.region
      ORDER BY discount_breaches DESC
    gold_tables: [historical_deals, customer_master, product_master]
    gold_columns: [region, relationship_discount_pct, max_discount_allowed_pct, customer_id, product_id]
    gold_result:
      - {region: Abu Dhabi, discount_breaches: 3}
      - {region: Sharjah, discount_breaches: 2}
    row_count: 2
