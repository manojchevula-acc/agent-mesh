  - id: D71
    question: "For won deals, what is the deal count and total requested volume by customer region and treasury benchmark index (EIBOR vs SOFR)? I need our interest-rate-index exposure by region."
    domain: treasury
    persona: cfo
    difficulty: multi-table-join
    note: >-
      Same historical_deals + customer_master + treasury_rate_sheet combo as D62, but a
      different metric (volume/count exposure, not a funding-cost comparison) and a
      different cut (benchmark_index instead of currency) — a realistic ALM/rate-exposure
      question distinct from D62's cost-comparison framing.
    gold_sql: >
      SELECT cm.region, trs.benchmark_index, COUNT(*) AS won_deals,
             SUM(hd.requested_amount) AS won_volume_aed
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.treasury_rate_sheet trs ON hd.currency = trs.currency AND hd.tenor = trs.tenor
      WHERE hd.deal_outcome = 'Won'
      GROUP BY cm.region, trs.benchmark_index
      ORDER BY won_volume_aed DESC
    gold_tables: [historical_deals, customer_master, treasury_rate_sheet]
    gold_columns: [region, benchmark_index, requested_amount, customer_id, currency, tenor, deal_outcome]
