  - id: D63
    question: "Give me a deal tape for won Treasury-product deals: deal id, customer region, product name, requested amount, and the treasury benchmark index and rate used for that deal's currency and tenor."
    domain: treasury
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      Forces all FOUR base tables into one plan (three joins): historical_deals is the
      grain, customer_master for region, product_master for product_name, and
      treasury_rate_sheet for benchmark_index/benchmark_rate_pct on currency+tenor.
      product_type = 'Treasury' is already on historical_deals so it does NOT excuse
      dropping the product_master join — product_name still only lives there. (An
      earlier draft asked for deals where the charged funding cost exceeds the
      benchmark, but funding_cost_pct is always booked EQUAL to the benchmark rate in
      this dataset, so that comparison is an empty-gold trap — this version pulls the
      same four-table join without relying on a threshold that never fires.)
    order_sensitive: true
    gold_sql: >
      SELECT hd.deal_id, cm.region, pm.product_name, hd.requested_amount,
             trs.benchmark_index, trs.benchmark_rate_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      JOIN fab_curated.treasury_rate_sheet trs ON hd.currency = trs.currency AND hd.tenor = trs.tenor
      WHERE hd.deal_outcome = 'Won' AND hd.product_type = 'Treasury'
      ORDER BY hd.deal_id
    gold_tables: [historical_deals, customer_master, product_master, treasury_rate_sheet]
    gold_columns: [deal_id, region, product_name, requested_amount, benchmark_index, benchmark_rate_pct, customer_id, product_id, currency, tenor, deal_outcome, product_type]
    gold_result:
      - {deal_id: DEAL010, region: Fujairah, product_name: FX Forward Facility, requested_amount: 18700000, benchmark_index: SOFR, benchmark_rate_pct: 4.88}
      - {deal_id: DEAL030, region: Fujairah, product_name: FX Forward Facility, requested_amount: 17900000, benchmark_index: SOFR, benchmark_rate_pct: 4.75}
      - {deal_id: DEAL048, region: Fujairah, product_name: FX Forward Facility, requested_amount: 11500000, benchmark_index: SOFR, benchmark_rate_pct: 4.8}
      - {deal_id: DEAL055, region: Fujairah, product_name: FX Forward Facility, requested_amount: 2900000, benchmark_index: SOFR, benchmark_rate_pct: 4.75}
    row_count: 4
  - id: D64
    question: "For won deals, how many required approval because the relationship discount exceeded the policy's approval threshold, broken down by customer risk category and product type?"
    domain: compliance
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      approval_required_if_discount_above_pct lives on pricing_policy ONLY, keyed on the
      compound (customer_segment, risk_category, product_type) — same policy join shape
      as D53/D54. (An earlier draft of this item read rwa_risk_weight_pct instead, but
      pricing_recommendation_view exposes that column renamed as
      policy_rwa_risk_weight_pct ALONGSIDE deal_outcome, risk_category and product_type —
      a correct agent could have answered the whole thing from that one view, no base
      join at all. approval_required_if_discount_above_pct is NOT exposed on any view
      that also carries deal_outcome, so this version genuinely forces the base tables.)
    gold_sql: >
      SELECT cm.risk_category, pm.product_type, COUNT(*) AS deals_needing_approval
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      JOIN fab_curated.pricing_policy pp ON pp.customer_segment = cm.customer_segment
        AND pp.risk_category = cm.risk_category AND pp.product_type = pm.product_type
      WHERE hd.deal_outcome = 'Won' AND hd.relationship_discount_pct > pp.approval_required_if_discount_above_pct
      GROUP BY cm.risk_category, pm.product_type
      ORDER BY deals_needing_approval DESC
    gold_tables: [historical_deals, customer_master, product_master, pricing_policy]
    gold_columns: [risk_category, product_type, approval_required_if_discount_above_pct, relationship_discount_pct, customer_id, product_id, customer_segment, deal_outcome]
    gold_result:
      - {risk_category: Low, product_type: Loan, deals_needing_approval: 8}
      - {risk_category: Medium, product_type: Loan, deals_needing_approval: 5}
      - {risk_category: Medium, product_type: Trade Finance, deals_needing_approval: 3}
      - {risk_category: Low, product_type: Deposit, deals_needing_approval: 3}
      - {risk_category: Low, product_type: Trade Finance, deals_needing_approval: 3}
      - {risk_category: Medium, product_type: Deposit, deals_needing_approval: 1}
    row_count: 6

  # --- FORCED MULTI-JOIN, DEEPER TOPOLOGIES (D65-D72) -------------------------
  # D58-D64 each held at most one bridge beyond historical_deals. pricing_recommendation_view
  # turned out to be a wider trap than the D58-D61 notes accounted for: it pre-joins deal +
  # customer + product + a RENAMED slice of policy (policy_min_margin_pct,
  # policy_min_expected_margin_pct, policy_max_discount_pct, policy_rwa_risk_weight_pct) into
  # ONE row, alongside deal_outcome, risk_category and product_type. So "Won deals" is NOT
  # enough to force a base-table join by itself if the pricing_policy column asked for has a
  # renamed twin on that view (this is what broke the original D64 — see its note).
  # The columns below were verified column-by-column against every view's declared fields:
  #   * approval_required_if_discount_above_pct — NOT exposed on pricing_recommendation_view
  #     under any name (the view only renames min_margin/min_expected_margin/max_discount/
  #     rwa_risk_weight); the views that DO carry it (segment_pricing_benchmark,
  #     relationship_discount_view, policy_exception_view) all lack deal_outcome. Safe.
  #   * pricing_policy.risk_premium_pct (the POLICY premium, not the deal's charged one) has
  #     NO renamed twin on any view at all. Safe unconditionally.
  #   * min_ticket_size / max_ticket_size / max_discount_allowed_pct / eligible_segments /
  #     eligible_tenors — product_master ONLY, confirmed by a full-file grep. Safe.
  #   * benchmark_index — treasury_rate_sheet ONLY (D58-D63's existing guarantee).
  #   * Any question needing a treasury_rate_sheet fact TOGETHER WITH a pricing_policy fact
  #     is structurally shortcut-proof regardless of either column individually: validator
  #     check #9 lets a view join ONLY to customer_master, and no view's declared joins reach
  #     pricing_policy or treasury_rate_sheet at all — so the base historical_deals hub is the
  #     only legal way to combine the two (D65, D66, D70).

  - id: D65
    question: "For won deals, how does the average risk premium we charged compare to the average policy risk premium, broken down by treasury benchmark index (EIBOR vs SOFR) and customer risk category?"
    domain: risk-capital
    persona: cfo
    difficulty: multi-table-join
    note: >-
      New 4-table combo: historical_deals + customer_master + treasury_rate_sheet +
      pricing_policy, no product_master (the policy join uses hd.product_type directly,
      same pattern as D53). Shortcut-proof by construction: pricing_policy.risk_premium_pct
      has no renamed twin on any view, and benchmark_index is treasury_rate_sheet-only, so
      no single view can supply both facts in one row (views may only join to
      customer_master, never to pricing_policy or treasury_rate_sheet).
    gold_sql: >
      SELECT trs.benchmark_index, cm.risk_category, COUNT(*) AS won_deals,
             ROUND(AVG(hd.risk_premium_pct), 2) AS avg_charged_risk_premium_pct,
             ROUND(AVG(pp.risk_premium_pct), 2) AS avg_policy_risk_premium_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.treasury_rate_sheet trs ON hd.currency = trs.currency AND hd.tenor = trs.tenor
      JOIN fab_curated.pricing_policy pp ON cm.customer_segment = pp.customer_segment
        AND hd.product_type = pp.product_type AND cm.risk_category = pp.risk_category
      WHERE hd.deal_outcome = 'Won'
      GROUP BY trs.benchmark_index, cm.risk_category
      ORDER BY avg_charged_risk_premium_pct DESC
    gold_tables: [historical_deals, customer_master, treasury_rate_sheet, pricing_policy]
    gold_columns: [benchmark_index, risk_category, risk_premium_pct, customer_id, tenor, currency, customer_segment, product_type, deal_outcome]
    gold_result:
      - {benchmark_index: EIBOR, risk_category: High, won_deals: 9, avg_charged_risk_premium_pct: 0.95, avg_policy_risk_premium_pct: 0.95}
      - {benchmark_index: SOFR, risk_category: High, won_deals: 4, avg_charged_risk_premium_pct: 0.95, avg_policy_risk_premium_pct: 0.95}
      - {benchmark_index: SOFR, risk_category: Medium, won_deals: 2, avg_charged_risk_premium_pct: 0.45, avg_policy_risk_premium_pct: 0.45}
      - {benchmark_index: EIBOR, risk_category: Medium, won_deals: 22, avg_charged_risk_premium_pct: 0.45, avg_policy_risk_premium_pct: 0.45}
      - {benchmark_index: EIBOR, risk_category: Low, won_deals: 11, avg_charged_risk_premium_pct: 0.1, avg_policy_risk_premium_pct: 0.1}
      - {benchmark_index: SOFR, risk_category: Low, won_deals: 3, avg_charged_risk_premium_pct: 0.1, avg_policy_risk_premium_pct: 0.1}
    row_count: 6
