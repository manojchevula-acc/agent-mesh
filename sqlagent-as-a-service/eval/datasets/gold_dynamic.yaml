  - id: D55
    question: "What is the total RWA for customers with relationship tenure over 5 years versus 5 years or less?"
    domain: risk-capital
    persona: cfo
    difficulty: join-case-banding
    note: >-
      relationship_tenure_years is on customer_master only (not on rwa_impact_view) — join required.
    gold_sql: >
      SELECT CASE WHEN cm.relationship_tenure_years > 5 THEN 'Over 5 years' ELSE '5 years or less' END AS tenure_band,
             ROUND(SUM(rw.rwa_aed), 2) AS total_rwa_aed
