  - id: D70
    question: "For won deals, broken down by product name, how does the risk premium we charged compare to the policy risk premium, and how does the funding cost we charged compare to the treasury benchmark funding cost?"
    domain: treasury
    persona: cfo
    difficulty: multi-table-join
    note: >-
      All five base tables again, aggregate style instead of D66's row listing — two
      independent comparisons (policy and treasury) collapsed onto one line per product.
      funding_cost_pct is always booked equal to the treasury benchmark in this dataset
      (see D63's note), so those two columns will match exactly; the risk-premium pair is
      where real variance shows up.
    gold_sql: >
      SELECT pm.product_name,
             ROUND(AVG(hd.risk_premium_pct), 2) AS avg_charged_risk_premium_pct,
             ROUND(AVG(pp.risk_premium_pct), 2) AS avg_policy_risk_premium_pct,
             ROUND(AVG(hd.funding_cost_pct), 2) AS avg_charged_funding_cost_pct,
             ROUND(AVG(trs.funding_cost_pct), 2) AS avg_benchmark_funding_cost_pct
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      JOIN fab_curated.treasury_rate_sheet trs ON hd.currency = trs.currency AND hd.tenor = trs.tenor
      JOIN fab_curated.pricing_policy pp ON cm.customer_segment = pp.customer_segment
        AND pm.product_type = pp.product_type AND cm.risk_category = pp.risk_category
      WHERE hd.deal_outcome = 'Won'
      GROUP BY pm.product_name
      ORDER BY pm.product_name
    gold_tables: [historical_deals, customer_master, product_master, treasury_rate_sheet, pricing_policy]
    gold_columns: [product_name, risk_premium_pct, funding_cost_pct, customer_id, product_id, currency, tenor, customer_segment, risk_category, product_type, deal_outcome]
    gold_result:
      - {product_name: Corporate Deposit, avg_charged_risk_premium_pct: 0.44, avg_policy_risk_premium_pct: 0.44, avg_charged_funding_cost_pct: 5.31, avg_benchmark_funding_cost_pct: 5.31}
      - {product_name: FX Forward Facility, avg_charged_risk_premium_pct: 0.95, avg_policy_risk_premium_pct: 0.95, avg_charged_funding_cost_pct: 5.0, avg_benchmark_funding_cost_pct: 5.0}
      - {product_name: Invoice Discounting, avg_charged_risk_premium_pct: 0.24, avg_policy_risk_premium_pct: 0.24, avg_charged_funding_cost_pct: 5.13, avg_benchmark_funding_cost_pct: 5.13}
      - {product_name: Overdraft Facility, avg_charged_risk_premium_pct: 0.65, avg_policy_risk_premium_pct: 0.65, avg_charged_funding_cost_pct: 5.43, avg_benchmark_funding_cost_pct: 5.43}
      - {product_name: Term Loan, avg_charged_risk_premium_pct: 0.48, avg_policy_risk_premium_pct: 0.48, avg_charged_funding_cost_pct: 5.78, avg_benchmark_funding_cost_pct: 5.78}
      - {product_name: Trade Finance LC, avg_charged_risk_premium_pct: 0.53, avg_policy_risk_premium_pct: 0.53, avg_charged_funding_cost_pct: 5.28, avg_benchmark_funding_cost_pct: 5.28}
      - {product_name: USD Term Loan, avg_charged_risk_premium_pct: 0.24, avg_policy_risk_premium_pct: 0.24, avg_charged_funding_cost_pct: 5.29, avg_benchmark_funding_cost_pct: 5.29}
      - {product_name: Working Capital Loan, avg_charged_risk_premium_pct: 0.44, avg_policy_risk_premium_pct: 0.44, avg_charged_funding_cost_pct: 5.12, avg_benchmark_funding_cost_pct: 5.12}
