  - id: D67
    question: "For won deals, what is the average headroom above the product's minimum ticket size — requested amount minus the minimum — by customer region and product? I want to see where we're closest to the floor."
    domain: product
    persona: pricing-desk
    difficulty: multi-table-join
    note: >-
      New metric off the D57/D61/D63 historical_deals+customer_master+product_master
      combo: min_ticket_size (product_master-only, confirmed absent from every view).
      (An earlier draft filtered for deals BELOW the minimum, but that comparison is
      empty-gold in this dataset — every booked deal already clears its product's floor
      — so this version keeps the same join and column but asks for the headroom
      instead of a violation count.)
    gold_sql: >
      SELECT cm.region, pm.product_name,
             ROUND(AVG(hd.requested_amount - pm.min_ticket_size), 2) AS avg_headroom_above_min_ticket_aed
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.product_master pm ON hd.product_id = pm.product_id
      WHERE hd.deal_outcome = 'Won'
      GROUP BY cm.region, pm.product_name
      ORDER BY avg_headroom_above_min_ticket_aed ASC
      LIMIT 50
    gold_tables: [historical_deals, customer_master, product_master]
    gold_columns: [region, product_name, requested_amount, min_ticket_size, customer_id, product_id, deal_outcome]
