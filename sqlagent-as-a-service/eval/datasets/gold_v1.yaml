  # --- RATIO / CONDITIONAL AGGREGATION -------------------------------------
  - id: D14
    question: "What is the win rate for each sales channel?"
    expect_tool: analytical_query
    expect_tier: full_dynamic
    scopes: [dynamic_sql]
    primary_metric: gold_exec
    domain: deals-pricing
    persona: branch-manager
    difficulty: conditional-aggregate
    note: "requires SUM(CASE WHEN outcome='Won') / COUNT(*) — a conditional ratio, not a
           column that exists anywhere."
    tags: [historical_deals]
    gold_sql: >
      SELECT sales_channel, COUNT(*) AS total_deals,
             SUM(CASE WHEN deal_outcome = 'Won' THEN 1 ELSE 0 END) AS won_deals,
             ROUND(SUM(CASE WHEN deal_outcome = 'Won' THEN 1 ELSE 0 END) * 100.0
                   / COUNT(*), 2) AS win_rate_pct
      FROM fab_curated.historical_deals
      GROUP BY sales_channel ORDER BY win_rate_pct DESC;
    gold_tables: [historical_deals]
    gold_columns: [sales_channel, deal_outcome]
    gold_result: null
    variants:
      - {lang: en, text: "which origination channel wins the most deals, proportionally?"}

