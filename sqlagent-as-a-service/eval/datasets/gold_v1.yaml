    scopes: [dynamic_sql]
    primary_metric: gold_exec
    domain: margin
    persona: cfo
    difficulty: multi-step-subquery
    note: "two steps: rank product types by won volume, THEN average margin for the winner.
           Must stay inside historical_deals — mixing a view with a base-table subquery
