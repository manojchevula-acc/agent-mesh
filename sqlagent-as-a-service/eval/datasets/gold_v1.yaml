  # --- CONDITIONAL LOGIC / CASE BANDING ------------------------------------
  - id: D19
    question: "Bucket customers into Large (>= 40m AED), Mid (>= 15m) and Small exposure bands, and show how many customers and how much total exposure sit in each."
    expect_tool: analytical_query
    expect_tier: full_dynamic
    scopes: [dynamic_sql]
    primary_metric: gold_exec
    domain: risk-capital
    persona: cfo
    difficulty: case-banding
    note: "the band is defined in the QUESTION — the agent must build the CASE from the
           thresholds given, not find a band column (none exists)."
    tags: [customer_master]
    gold_sql: >
      SELECT CASE WHEN existing_exposure_aed >= 40000000 THEN 'Large'
                  WHEN existing_exposure_aed >= 15000000 THEN 'Mid'
                  ELSE 'Small' END AS exposure_band,
             COUNT(*) AS customer_count,
             SUM(existing_exposure_aed) AS total_exposure_aed
      FROM fab_curated.customer_master
      GROUP BY exposure_band ORDER BY total_exposure_aed DESC;
    gold_tables: [customer_master]
    gold_columns: [existing_exposure_aed]
    gold_result: null

