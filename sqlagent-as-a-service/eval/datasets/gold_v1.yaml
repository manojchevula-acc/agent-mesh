  - id: D11
    question: "Which customer segment and risk band have the most deals priced below their policy minimum margin?"
    expect_tool: analytical_query
    expect_tier: full_dynamic
    scopes: [dynamic_sql]
    primary_metric: gold_exec
    domain: compliance
    persona: pricing-desk
    difficulty: multi-table-join
    tags: [historical_deals, customer_master, pricing_policy]
    gold_sql: >
      SELECT cm.customer_segment, cm.risk_category, COUNT(*) AS deals_below_floor
      FROM fab_curated.historical_deals hd
      JOIN fab_curated.customer_master cm ON hd.customer_id = cm.customer_id
      JOIN fab_curated.pricing_policy pp
        ON cm.customer_segment = pp.customer_segment
       AND hd.product_type = pp.product_type
       AND cm.risk_category = pp.risk_category
      WHERE hd.expected_margin_pct < pp.min_margin_pct
      GROUP BY cm.customer_segment, cm.risk_category ORDER BY deals_below_floor DESC;
    gold_tables: [historical_deals, customer_master, pricing_policy]
    gold_columns: [customer_segment, risk_category, customer_id, product_type,
                   expected_margin_pct, min_margin_pct]
    gold_result: null

