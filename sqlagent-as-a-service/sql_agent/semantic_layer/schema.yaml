# Section 3 — Semantic Layer, Full Specification (All 5 Tables)
#
# This is the ONLY place table and column names are declared. Tools, the validator's
# whitelist, and the dynamic-generation prompt all derive from this file. It is the
# security boundary: a column absent from (or marked blocked in) this layer cannot be
# selected by any tier.

# Columns that must NEVER be selectable by any tier. They are absent from the table
# definitions below; this explicit list is also fed to the validator's blocked-column
# check as defence in depth (Design Document §4.3, §11.2).
blocked_columns:
  - national_id
  - salary
  - salary_type

# Default DB schema for tables that do not declare their own `schema:`. The base
# tables live in fab_curated; the semantic views override this with fab_semantic.
# The tier-3 generator renders these as schema-qualified names so generated SQL
# resolves correctly regardless of the connection's default schema.
default_schema: fab_curated

tables:

  # 3.1 ---------------------------------------------------------------------------
  customer_master:
    grain: one row per customer
    primary_key: customer_id
    sensitivity_default: internal
    columns:
      customer_id:                {type: str,   sensitivity: public,   filterable: true,  desc: "Unique customer identifier, e.g. CUST002"}
      customer_name:              {type: str,   sensitivity: internal, filterable: true,  desc: "Legal customer name"}
      customer_segment:           {type: enum,  values: [Corporate, SME], filterable: true, desc: "Business segment used in policy lookup"}
      industry:                   {type: enum,  values: [Trading, Manufacturing, Logistics, Retail, Healthcare], filterable: true, desc: "Customer industry sector"}
      region:                     {type: enum,  values: [Dubai, Abu Dhabi, Sharjah, Ajman, Ras Al Khaimah, Fujairah], filterable: true, desc: "UAE emirate of the customer"}
      preferred_currency:         {type: enum,  values: [AED, USD], filterable: true, desc: "Customer's preferred settlement currency"}
      risk_category:              {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Internal risk band; drives risk premium and RWA"}
      internal_rating:            {type: str,   sensitivity: internal, filterable: true, desc: "Internal credit rating grade"}
      relationship_tenure_years:  {type: int,   unit: years, filterable: true, desc: "Years the customer has banked with FAB"}
      relationship_status:        {type: enum,  values: [New, Existing, Strategic], filterable: true, desc: "Relationship classification"}
      relationship_discount_pct:  {type: float, unit: pct, filterable: false, desc: "Negotiated relationship discount, subtracted in price formula"}
      annual_revenue_aed:         {type: int,   unit: AED, filterable: true, desc: "Customer annual revenue in AED"}
      debt_to_equity_ratio:       {type: float, unit: ratio, filterable: true, desc: "Gearing; customer debt-to-equity ratio"}
      credit_score:               {type: int,   sensitivity: internal, filterable: true, desc: "Internal credit score, higher is better"}
      existing_exposure_aed:      {type: int,   unit: AED, filterable: true, desc: "Current outstanding exposure in AED"}
    blocked_columns: []   # national_id / salary not present here; remain blocked in policy even if added later
    joins:
      pricing_policy: "customer_segment -> pricing_policy.customer_segment AND risk_category -> pricing_policy.risk_category"
      historical_deals: "customer_id -> historical_deals.customer_id"

  # 3.2 ---------------------------------------------------------------------------
  product_master:
    grain: one row per product
    primary_key: product_id
    sensitivity_default: public
    columns:
      product_id:               {type: str,   filterable: true,  desc: "Unique product identifier, e.g. PROD002"}
      product_name:             {type: str,   filterable: true,  desc: "Product display name"}
      product_type:             {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product family"}
      pricing_method:           {type: enum,  values: [Fixed, Floating], filterable: true, desc: "Rate basis"}
      currency:                 {type: enum,  values: [AED, USD], filterable: true, desc: "Product currency"}
      eligible_tenors:          {type: str,   format: "comma-delimited, e.g. '1M,3M,6M,12M'", filterable: true, note: "app-side parse or SQL LIKE; not 1NF", desc: "Allowed tenors for this product"}
      standard_margin_pct:      {type: float, unit: pct, filterable: false, desc: "Standard product margin added in price formula"}
      max_margin_pct:           {type: float, unit: pct, filterable: false, desc: "Maximum permitted margin"}
      max_discount_allowed_pct: {type: float, unit: pct, filterable: false, desc: "Product cap on relationship discount"}
      min_ticket_size:          {type: int,   unit: AED/USD, filterable: true, desc: "Minimum deal amount"}
      max_ticket_size:          {type: int,   unit: AED/USD, filterable: true, desc: "Maximum deal amount"}
      eligible_segments:        {type: str,   format: "comma-delimited, e.g. 'Corporate,SME'", filterable: true, note: "app-side parse or SQL LIKE", desc: "Segments allowed to buy this product"}
    blocked_columns: []
    joins:
      pricing_policy: "product_type -> pricing_policy.product_type"
      historical_deals: "product_id -> historical_deals.product_id"

  # 3.3 ---------------------------------------------------------------------------
  treasury_rate_sheet:
    grain: one row per currency + tenor (+ effective_date)
    primary_key: rate_id
    sensitivity_default: public
    columns:
      rate_id:            {type: str,   filterable: false, desc: "Unique rate-sheet row id"}
      currency:           {type: enum,  values: [AED, USD], filterable: true, desc: "Rate currency"}
      benchmark_index:    {type: enum,  values: [EIBOR, SOFR], filterable: true, desc: "Benchmark index used"}
      tenor:              {type: enum,  values: [1M, 3M, 6M, 12M, 24M, 36M, 60M], filterable: true, desc: "Rate tenor"}
      effective_date:     {type: date,  filterable: true, desc: "Date the rate became effective"}
      benchmark_rate_pct: {type: float, unit: pct, filterable: false, desc: "Benchmark index rate"}
      funding_cost_pct:   {type: float, unit: pct, filterable: false, desc: "Bank funding cost; first term of price formula"}
    blocked_columns: []
    joins:
      treasury_rate_sheet: "(implicit) product/deal currency + tenor -> treasury_rate_sheet.currency + tenor"

  # 3.4 ---------------------------------------------------------------------------
  pricing_policy:
    grain: one row per customer_segment + product_type + risk_category
    primary_key: policy_id
    sensitivity_default: internal
    columns:
      policy_id:                               {type: str,   filterable: true,  desc: "Unique policy row id"}
      customer_segment:                        {type: enum,  values: [Corporate, SME], filterable: true, desc: "Segment the policy applies to"}
      product_type:                            {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product type the policy applies to"}
      risk_category:                           {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Risk band the policy applies to"}
      min_margin_pct:                          {type: float, unit: pct, filterable: false, desc: "Policy floor margin; headroom is measured against this"}
      risk_premium_pct:                        {type: float, unit: pct, filterable: false, desc: "Risk premium added in price formula"}
      max_relationship_discount_pct:           {type: float, unit: pct, filterable: false, desc: "Policy cap on relationship discount"}
      approval_required_if_discount_above_pct: {type: float, unit: pct, filterable: false, desc: "Discount threshold above which approval is required"}
      min_expected_margin_pct:                 {type: float, unit: pct, filterable: false, desc: "Minimum expected margin permitted"}
      rwa_risk_weight_pct:                     {type: int,   unit: pct, filterable: false, desc: "Risk weight (50/75/100) used for RWA"}
      status:                                  {type: enum,  values: [Active, Inactive], filterable: true, desc: "Whether the policy row is active"}
    blocked_columns: []
    joins:
      customer_master: "customer_segment + risk_category"
      product_master: "product_type"

  # 3.5 ---------------------------------------------------------------------------
  historical_deals:
    grain: one row per past deal
    primary_key: deal_id
    sensitivity_default: internal
    columns:
      deal_id:                   {type: str,   filterable: true,  desc: "Unique deal identifier, e.g. DEAL001"}
      deal_date:                 {type: date,  filterable: true,  desc: "Date the deal was booked"}
      customer_id:               {type: str,   filterable: true,  desc: "Customer on the deal"}
      product_id:                {type: str,   filterable: true,  desc: "Product on the deal"}
      product_type:              {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product family of the deal"}
      currency:                  {type: enum,  values: [AED, USD], filterable: true, desc: "Deal currency"}
      tenor:                     {type: enum,  values: [1M, 3M, 6M, 12M, 24M, 36M, 60M], filterable: true, desc: "Deal tenor"}
      requested_amount:          {type: int,   unit: AED/USD, filterable: true, desc: "Requested deal amount"}
      funding_cost_pct:          {type: float, unit: pct, filterable: false, desc: "Funding cost at deal time"}
      standard_margin_pct:       {type: float, unit: pct, filterable: false, desc: "Standard margin at deal time"}
      risk_premium_pct:          {type: float, unit: pct, filterable: false, desc: "Risk premium at deal time"}
      relationship_discount_pct: {type: float, unit: pct, filterable: false, desc: "Relationship discount applied"}
      recommended_price_pct:     {type: float, unit: pct, filterable: false, desc: "Recommended all-in price"}
      final_approved_price_pct:  {type: float, unit: pct, filterable: false, desc: "Final approved price"}
      expected_margin_pct:       {type: float, unit: pct, filterable: true,  desc: "Expected margin on the deal"}
      deal_outcome:              {type: enum,  values: [Won, Lost], filterable: true, desc: "Whether the deal was won or lost"}
      sales_channel:             {type: enum,  values: [Relationship Manager, API Quote, Branch, Digital Upload], filterable: true, desc: "Origination channel"}
    blocked_columns: []
    joins:
      customer_master: "customer_id"
      product_master: "product_id"

  # ===========================================================================
  # SEMANTIC VIEWS (fab_semantic schema) — maintained by the DATA PIPELINE service.
  #
  # These are the SQL Agent's half of the cross-service contract. The columns
  # below must match fab_semantic views produced by the pipeline's
  # sql/03_create_semantic_views.sql. When the pipeline changes a view, update the
  # matching block here (and vice versa). Keys are UNQUALIFIED on purpose: the
  # validator's table whitelist matches sqlglot's bare Table.name, so a tool's
  # schema-qualified "fab_semantic.customer_360" reference validates against the
  # "customer_360" key here. See tools/semantic_view_tools.py.
  # ===========================================================================

  # V1 ---------------------------------------------------------------------------
  customer_360:
    schema: fab_semantic
    grain: one row per customer — profile enriched with aggregated deal KPIs
    primary_key: customer_id
    sensitivity_default: internal
    columns:
      customer_id:                  {type: str,   sensitivity: public,   filterable: true,  desc: "Unique customer identifier, e.g. CUST002"}
      customer_name:                {type: str,   sensitivity: internal, filterable: true,  desc: "Legal customer name"}
      customer_segment:             {type: enum,  values: [Corporate, SME], filterable: true, desc: "Business segment"}
      industry:                     {type: enum,  values: [Trading, Manufacturing, Logistics, Retail, Healthcare], filterable: true, desc: "Customer industry sector"}
      region:                       {type: enum,  values: [Dubai, Abu Dhabi, Sharjah, Ajman, Ras Al Khaimah, Fujairah], filterable: true, desc: "UAE emirate"}
      preferred_currency:           {type: enum,  values: [AED, USD], filterable: true, desc: "Preferred settlement currency"}
      risk_category:                {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Internal risk band"}
      internal_rating:              {type: str,   sensitivity: internal, filterable: true, desc: "Internal credit rating grade"}
      relationship_tenure_years:    {type: int,   unit: years, filterable: true, desc: "Years banking with FAB"}
      relationship_status:          {type: enum,  values: [New, Existing, Strategic], filterable: true, desc: "Relationship classification"}
      relationship_discount_pct:    {type: float, unit: pct, filterable: false, desc: "Negotiated relationship discount"}
      annual_revenue_aed:           {type: int,   unit: AED, filterable: true, desc: "Annual revenue in AED"}
      debt_to_equity_ratio:         {type: float, unit: ratio, filterable: true, desc: "Gearing; debt-to-equity ratio"}
      credit_score:                 {type: int,   sensitivity: internal, filterable: true, desc: "Internal credit score"}
      existing_exposure_aed:        {type: int,   unit: AED, filterable: true, desc: "Current outstanding exposure in AED"}
      total_deals:                  {type: int,   filterable: false, desc: "Total deal count"}
      won_deals:                    {type: int,   filterable: false, desc: "Number of won deals"}
      lost_deals:                   {type: int,   filterable: false, desc: "Number of lost deals"}
      total_deal_volume_aed:        {type: int,   unit: AED, filterable: false, desc: "Sum of requested amounts across deals"}
      avg_deal_size_aed:            {type: float, unit: AED, filterable: false, desc: "Average requested amount per deal", note: "Pre-aggregated at CUSTOMER grain (one value per customer). For a population-level average across many customers, AVG() of this column is an unweighted average-of-averages, NOT the true deal-weighted average. For a population statistic, aggregate the deal-grain rows in pricing_recommendation_view/margin_analysis instead."}
      avg_expected_margin_pct:      {type: float, unit: pct, filterable: false, desc: "Average expected margin across deals", note: "Pre-aggregated at CUSTOMER grain. AVG() of this column across customers is an unweighted average-of-averages, NOT the true deal-weighted average. For a population statistic (e.g. 'average margin across all Corporate customers'), aggregate expected_margin_pct from pricing_recommendation_view/margin_analysis (deal grain) instead."}
      avg_approved_price_pct:       {type: float, unit: pct, filterable: false, desc: "Average final approved price across deals", note: "Pre-aggregated at CUSTOMER grain — do not re-AVG() across customers for a population statistic; use deal-grain pricing_recommendation_view instead."}
      avg_relationship_discount_pct: {type: float, unit: pct, filterable: false, desc: "Average relationship discount across deals", note: "Pre-aggregated at CUSTOMER grain — do not re-AVG() across customers for a population statistic; use deal-grain data instead."}
      last_deal_date:               {type: date,  filterable: true, desc: "Date of the most recent deal"}
      win_rate_pct:                 {type: float, unit: pct, filterable: false, desc: "Won deals / total deals * 100", note: "Pre-aggregated at CUSTOMER grain — AVG() of this across customers is NOT the true won/total rate for the population; sum won_deals and total_deals separately across the population and divide instead."}
    blocked_columns: []

  # V2 ---------------------------------------------------------------------------
  pricing_recommendation_view:
    schema: fab_semantic
    grain: one row per historical deal — deal annotated with policy benchmarks and compliance flags
    primary_key: deal_id
    sensitivity_default: internal
    columns:
      deal_id:                       {type: str,   filterable: true,  desc: "Unique deal identifier, e.g. DEAL001"}
      deal_date:                     {type: date,  filterable: true,  desc: "Date the deal was booked"}
      customer_id:                   {type: str,   filterable: true,  desc: "Customer on the deal"}
      customer_name:                 {type: str,   sensitivity: internal, filterable: true, desc: "Customer legal name"}
      customer_segment:              {type: enum,  values: [Corporate, SME], filterable: true, desc: "Customer segment"}
      risk_category:                 {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Customer risk band"}
      internal_rating:               {type: str,   sensitivity: internal, filterable: true, desc: "Internal credit rating grade"}
      relationship_status:           {type: enum,  values: [New, Existing, Strategic], filterable: true, desc: "Relationship classification"}
      product_id:                    {type: str,   filterable: true,  desc: "Product on the deal"}
      product_name:                  {type: str,   filterable: true,  desc: "Product display name"}
      product_type:                  {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product family"}
      pricing_method:                {type: enum,  values: [Fixed, Floating], filterable: true, desc: "Rate basis"}
      currency:                      {type: enum,  values: [AED, USD], filterable: true, desc: "Deal currency"}
      tenor:                         {type: enum,  values: [1M, 3M, 6M, 12M, 24M, 36M, 60M], filterable: true, desc: "Deal tenor"}
      requested_amount:              {type: int,   unit: AED/USD, filterable: true, desc: "Requested deal amount"}
      benchmark_rate_pct_treasury:   {type: float, unit: pct, filterable: false, desc: "Latest treasury benchmark rate for the deal's currency+tenor"}
      funding_cost_pct:              {type: float, unit: pct, filterable: false, desc: "Funding cost at deal time"}
      target_margin_pct:             {type: float, unit: pct, filterable: false, desc: "Segment-benchmark target margin (falls back to product standard margin)"}
      risk_premium_pct:              {type: float, unit: pct, filterable: false, desc: "Risk premium at deal time"}
      ops_cost_margin_pct:           {type: float, unit: pct, filterable: false, desc: "Operational cost margin applied in the price build-up"}
      relationship_discount_pct:     {type: float, unit: pct, filterable: false, desc: "Relationship discount applied"}
      system_recommended_price_pct:  {type: float, unit: pct, filterable: false, desc: "Recommended price rebuilt from pricing components"}
      recommended_price_pct:         {type: float, unit: pct, filterable: false, desc: "Recommended all-in price as booked"}
      approved_price_pct:            {type: float, unit: pct, filterable: false, desc: "Final approved price"}
      expected_margin_pct:           {type: float, unit: pct, filterable: false, desc: "Expected margin on the deal"}
      deal_outcome:                  {type: enum,  values: [Won, Lost], filterable: true, desc: "Deal outcome"}
      sales_channel:                 {type: enum,  values: [Relationship Manager, API Quote, Branch, Digital Upload], filterable: true, desc: "Origination channel"}
      policy_min_margin_pct:         {type: float, unit: pct, filterable: false, desc: "Applicable policy floor margin"}
      policy_min_expected_margin_pct: {type: float, unit: pct, filterable: false, desc: "Applicable policy minimum expected margin"}
      policy_max_discount_pct:       {type: float, unit: pct, filterable: false, desc: "Applicable policy max relationship discount"}
      policy_rwa_risk_weight_pct:    {type: int,   unit: pct, filterable: false, desc: "Applicable policy RWA risk weight"}
      price_below_policy_floor:      {type: bool,  filterable: true, desc: "True if final price < policy floor margin"}
      margin_below_min:              {type: bool,  filterable: true, desc: "True if expected margin < policy minimum"}
      discount_exceeds_policy:       {type: bool,  filterable: true, desc: "True if relationship discount > policy cap"}
      policy_compliant:              {type: bool,  filterable: true, desc: "True if the deal breached no policy rule"}
    blocked_columns: []
    joins:
      customer_master: "customer_id -> customer_master.customer_id"

  # V3 ---------------------------------------------------------------------------
  margin_analysis:
    schema: fab_semantic
    grain: one row per historical deal — margin decomposition with treasury benchmark comparison
    primary_key: deal_id
    sensitivity_default: internal
    columns:
      deal_id:                     {type: str,   filterable: true,  desc: "Unique deal identifier"}
      deal_date:                   {type: date,  filterable: true,  desc: "Date the deal was booked"}
      customer_id:                 {type: str,   filterable: true,  desc: "Customer on the deal"}
      customer_name:               {type: str,   sensitivity: internal, filterable: true, desc: "Customer legal name"}
      customer_segment:            {type: enum,  values: [Corporate, SME], filterable: true, desc: "Customer segment"}
      region:                      {type: enum,  values: [Dubai, Abu Dhabi, Sharjah, Ajman, Ras Al Khaimah, Fujairah], filterable: true, desc: "UAE emirate"}
      risk_category:               {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Customer risk band"}
      internal_rating:             {type: str,   sensitivity: internal, filterable: true, desc: "Internal credit rating grade"}
      product_id:                  {type: str,   filterable: true,  desc: "Product on the deal"}
      product_type:                {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product family"}
      currency:                    {type: enum,  values: [AED, USD], filterable: true, desc: "Deal currency"}
      tenor:                       {type: enum,  values: [1M, 3M, 6M, 12M, 24M, 36M, 60M], filterable: true, desc: "Deal tenor"}
      requested_amount:            {type: int,   unit: AED/USD, filterable: true, desc: "Requested deal amount"}
      funding_cost_pct:            {type: float, unit: pct, filterable: false, desc: "Funding cost at deal time"}
      risk_premium_pct:            {type: float, unit: pct, filterable: false, desc: "Risk premium at deal time"}
      relationship_discount_pct:   {type: float, unit: pct, filterable: false, desc: "Relationship discount applied"}
      recommended_price_pct:       {type: float, unit: pct, filterable: false, desc: "Recommended all-in price"}
      final_approved_price_pct:    {type: float, unit: pct, filterable: false, desc: "Final approved price"}
      expected_margin_pct:         {type: float, unit: pct, filterable: false, desc: "Expected margin on the deal"}
      deal_outcome:                {type: enum,  values: [Won, Lost], filterable: true, desc: "Deal outcome"}
      benchmark_rate_pct_treasury: {type: float, unit: pct, filterable: false, desc: "Latest treasury benchmark rate for currency+tenor"}
      net_margin_pct:              {type: float, unit: pct, filterable: false, desc: "Final price minus funding, risk premium, and discount"}
      spread_over_benchmark_pct:   {type: float, unit: pct, filterable: false, desc: "Final price minus treasury benchmark"}
      margin_vs_recommended_pct:   {type: float, unit: pct, filterable: false, desc: "Final price minus recommended price"}
      min_expected_margin_pct:     {type: float, unit: pct, filterable: false, desc: "Applicable policy minimum expected margin"}
      margin_below_minimum:        {type: bool,  filterable: true,  desc: "True if expected margin < policy minimum expected margin"}
    blocked_columns: []
    joins:
      customer_master: "customer_id -> customer_master.customer_id"

  # V4 ---------------------------------------------------------------------------
  profitability_summary:
    schema: fab_semantic
    grain: one row per customer x product_type — won-deals roll-up with profitability tier
    search_terms: >
      how profitable is this customer; profitability by product; net profit for a customer;
      profitability tier; show profitability for a customer; revenue and cost breakdown
    primary_key: null
    sensitivity_default: internal
    columns:
      customer_id:               {type: str,   filterable: true,  desc: "Customer the rollup is for"}
      customer_segment:          {type: enum,  values: [Corporate, SME], filterable: true, desc: "Customer segment"}
      region:                    {type: enum,  values: [Dubai, Abu Dhabi, Sharjah, Ajman, Ras Al Khaimah, Fujairah], filterable: true, desc: "UAE emirate"}
      risk_category:             {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Customer risk band"}
      product_type:              {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product family"}
      total_won_deals:           {type: int,   filterable: false, desc: "Count of won deals in this group"}
      total_volume_aed:          {type: int,   unit: AED, filterable: false, desc: "Sum of requested amounts for won deals"}
      revenue_aed:               {type: float, unit: AED, filterable: false, desc: "Sum of amount * final approved price"}
      funding_cost_aed:          {type: float, unit: AED, filterable: false, desc: "Sum of amount * funding cost"}
      operating_cost_aed:        {type: float, unit: AED, filterable: false, desc: "Sum of amount * operational cost margin"}
      capital_cost_aed:          {type: float, unit: AED, filterable: false, desc: "Basel III capital cost on RWA for the group"}
      net_profit_aed:            {type: float, unit: AED, filterable: false, desc: "Revenue minus funding, risk premium, discount and ops cost"}
      avg_net_margin_pct:        {type: float, unit: pct, filterable: false, desc: "Average net margin", note: "Pre-aggregated at CUSTOMER x PRODUCT_TYPE grain — AVG() of this column across rows is an unweighted average-of-averages, NOT the true deal-weighted average. For a population statistic, aggregate deal-grain net margin from margin_analysis instead, or weight by total_won_deals."}
      profitability_tier:        {type: enum,  values: [Loss-Making, Low, Medium, High], filterable: true, desc: "Tier by average net margin"}
    blocked_columns: []
    joins:
      customer_master: "customer_id -> customer_master.customer_id"

  # V5 ---------------------------------------------------------------------------
  rwa_impact_view:
    schema: fab_semantic
    grain: one row per won historical deal — Basel III RWA and capital metrics
    search_terms: >
      RWA and capital impact for a customer; risk-weighted assets; Basel III capital charge;
      return on RWA; how much capital does this deal or customer consume
    primary_key: deal_id
    sensitivity_default: internal
    columns:
      deal_id:                  {type: str,   filterable: true,  desc: "Unique deal identifier"}
      deal_date:                {type: date,  filterable: true,  desc: "Date the deal was booked"}
      customer_id:              {type: str,   filterable: true,  desc: "Customer on the deal"}
      customer_segment:         {type: enum,  values: [Corporate, SME], filterable: true, desc: "Customer segment"}
      product_type:             {type: enum,  values: [Loan, Trade Finance, Treasury, Deposit], filterable: true, desc: "Product family"}
      risk_category:            {type: enum,  values: [Low, Medium, High], filterable: true, desc: "Customer risk band"}
      currency:                 {type: enum,  values: [AED, USD], filterable: true, desc: "Deal currency"}
