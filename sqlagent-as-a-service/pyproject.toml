[project]
name = "sql-agent"
version = "1.0.0"
description = "Production-grade multi-agent ReAct SQL Agent for the GERNAS v3.0 FAB pricing platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Microsoft Agent Framework — orchestration (workflows), tool declaration
    # (@tool), message types. Provider clients ship as SEPARATE distributions, so
    # agent-framework-openai must be listed explicitly (it serves OpenAI, Groq via
    # base_url, AND Azure via azure_endpoint — there is no separate Azure chat class).
    "agent-framework>=1.16.0,<2",
    "agent-framework-openai>=1.14.0",
    # agent-framework-openai requires openai>=2.25,<3. Pin the ceiling explicitly:
    # a bare `openai` resolves to 3.x and breaks the import at runtime.
    "openai>=2.25,<3",
    "sqlglot>=25.0.0",
    "sqlalchemy>=2.0.0",
    # Database drivers — works on both PostgreSQL and MySQL out of the box.
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
# Scoped schema retrieval for the dynamic tier (Component B). Only needed when
# SCHEMA_RETRIEVAL_ENABLED=true; imports are lazy so the agent runs without these.
retrieval = [
    "sentence-transformers>=3.0.0",  # local embeddings (default BAAI/bge-base-en-v1.5)
    "rank-bm25>=0.2.2",              # sparse lexical ranker for hybrid search
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",             # optional VECTOR_BACKEND=faiss (file-based index)
    "qdrant-client>=1.9.0",         # optional VECTOR_BACKEND=qdrant (existing service)
]

# Optional graph-database backend for the metadata KG. Only needed when KG_BACKEND=neo4j;
# the driver is imported lazily so the package works without it.
kg = [
    "neo4j>=5.0.0",
]

# Anthropic as a per-step provider. Only needed when any LLM_*_PROVIDER=anthropic.
# Imported lazily by llm/factory.py, so the package runs without it.
# NOTE: agent-framework-anthropic still ships as a pre-release (1.0.0bNNNNNN) even
# though the core agent-framework package has reached 1.x stable — pin loosely and
# re-check when it stabilizes.
anthropic = [
    "agent-framework-anthropic>=1.0.0b1",
]

# Streamlit chat UI for the POC (ui/app.py). Talks to the FastAPI service over plain
# HTTP, so it has no dependency on the agent internals beyond this — install with
# `uv sync --extra demo` and run `streamlit run ui/app.py` alongside the service.
demo = [
    "streamlit>=1.38.0",
    "requests>=2.31.0",
]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "pytest>=8.0.0",
    "openpyxl>=3.1.0",  # used by scripts/load_excel_to_db.py to read the POC workbook
    # Comment-preserving YAML round-trip. eval/materialize_gold.py rewrites gold_result
    # inline in eval/datasets/*.yaml; PyYAML would drop the dataset's documentation.
    "ruamel.yaml>=0.18.0",
]
# Conversation memory in production (Postgres-backed ConversationStore + metadata DB).
# Only needed when CHECKPOINTER_BACKEND=postgres:  uv sync --group memory
# Dev uses the in-memory store and needs none of these. The sqlite backend needs
# nothing extra either — stdlib sqlite3.
memory = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",     # connection pool for the long-lived store
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
