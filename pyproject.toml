[project]
name = "agent-mesh-workspace"
version = "0.1.0"
description = "Unified workspace for agent-mesh, datalayer-as-service, and rag-as-a-service"
requires-python = ">=3.12"
dependencies = [
    # -------------------------------------------------------------------------
    # LangGraph / LangChain — core orchestration
    # NOTE: groq is capped <1.0.0 because langchain-groq 1.1.x requires groq<1.0.0.
    # NOTE: mcp is capped <2.0.0 because MCP 2.0 changed the streamable-HTTP
    #       transport API used in agent-mesh/src/integrations/mcp_clients.py.
    # -------------------------------------------------------------------------
    "langgraph>=0.2.0",
    "langchain>=1.0.0",
    "langchain-core>=1.4.8",
    "langchain-openai>=0.3.0",
    "langchain-groq>=1.1.0",
    "langchain-anthropic>=0.1.22",
    "langchain-huggingface>=0.0.3",
    "langchain-text-splitters>=1.1.2",
    "langchain-community>=0.4.2",

    # -------------------------------------------------------------------------
    # FastAPI / ASGI stack
    # -------------------------------------------------------------------------
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.49.0",
    "starlette>=1.3.1",
    "sse-starlette>=3.4.5",
    "python-multipart>=0.0.32",

    # -------------------------------------------------------------------------
    # Pydantic
    # -------------------------------------------------------------------------
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",

    # -------------------------------------------------------------------------
    # LLM clients
    # -------------------------------------------------------------------------
    "anthropic>=0.80.0",
    "openai>=2.43.0",
    "ollama>=0.5.3",
    "groq>=0.30.0,<1.0.0",

    # -------------------------------------------------------------------------
    # MCP (Model Context Protocol)
    # -------------------------------------------------------------------------
    "mcp[cli]>=1.28.0,<2.0.0",
    "fastmcp>=2.0.0",

    # -------------------------------------------------------------------------
    # OpenTelemetry observability stack
    # -------------------------------------------------------------------------
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-proto>=1.42.1",
    "opentelemetry-semantic-conventions>=0.63b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-exporter-otlp-proto-common>=1.42.1",
    "opentelemetry-instrumentation>=0.63b1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-instrumentation-asgi>=0.63b1",
    "opentelemetry-instrumentation-starlette>=0.63b1",
    "opentelemetry-instrumentation-logging>=0.61b0",
    "opentelemetry-resource-detector-azure>=0.1.5",
    "azure-monitor-opentelemetry>=1.8.2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b45",

    # -------------------------------------------------------------------------
    # Azure SDK
    # -------------------------------------------------------------------------
    "azure-identity>=1.25.3",
    "azure-core>=1.41.0",
    "azure-core-tracing-opentelemetry>=1.0.0b13",
    "azure-ai-inference>=1.0.0b9",
    "azure-ai-projects>=2.2.0",
    "azure-search-documents>=11.7.0b2",

    # -------------------------------------------------------------------------
    # Machine learning — embeddings, transformers, retrieval
    # NOTE: sentence-transformers may resolve to 6.x (floor 3.3.0).
    #       If rag-as-a-service reranker breaks, pin to <4.0.0 and investigate.
    # -------------------------------------------------------------------------
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=5.12.1",
    "tokenizers>=0.22.2",
    "sentence-transformers>=3.3.0",
    "FlagEmbedding>=1.4.0",
    "accelerate>=1.14.0",
    "safetensors>=0.8.0",
    "peft>=0.19.1",
    "huggingface-hub>=1.20.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",

    # -------------------------------------------------------------------------
    # Vector databases
    # NOTE: chromadb may resolve to 1.x (0.5.0 floor — major API overhaul at 1.0).
    # NOTE: pymilvus may resolve to 3.x (2.4.0 floor — breaking changes at 3.0).
    # -------------------------------------------------------------------------
    "qdrant-client>=1.18.0",
    "pymilvus>=2.4.0",
    "chromadb>=0.5.0",

    # -------------------------------------------------------------------------
    # Data processing
    # -------------------------------------------------------------------------
    "pandas>=3.0.3",
    "numpy>=2.5.0",
    "sqlalchemy>=2.0.51",
    "pyarrow>=24.0.0",

    # -------------------------------------------------------------------------
    # Database drivers (datalayer-as-service)
    # -------------------------------------------------------------------------
    "pymysql>=1.1.0",

    # -------------------------------------------------------------------------
    # Document extraction (rag-as-a-service ingestion pipeline)
    # -------------------------------------------------------------------------
    "docling>=2.105.0",
    "docling-core>=2.83.1",
    "pypdfium2>=5.10.1",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "lxml>=6.1.1",
    "beautifulsoup4>=4.15.0",
    "pillow>=12.2.0",

    # -------------------------------------------------------------------------
    # RAG evaluation
    # -------------------------------------------------------------------------
    "datasets>=5.0.0",
    "ragas>=0.1.14",

    # -------------------------------------------------------------------------
    # Caching (Redis)
    # -------------------------------------------------------------------------
    "redis[hiredis]>=7.1.1",
    "redisvl>=0.15.0",

    # -------------------------------------------------------------------------
    # HTTP and async networking
    # -------------------------------------------------------------------------
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "aiohttp>=3.14.1",
    "requests>=2.34.2",
    "anyio>=4.14.0",

    # -------------------------------------------------------------------------
    # Logging and observability utilities
    # -------------------------------------------------------------------------
    "structlog>=26.1.0",
    "python-json-logger>=4.1.0",
    "colorlog>=6.10.1",
    "rich>=15.0.0",
    "colorama==0.4.6",

    # -------------------------------------------------------------------------
    # Configuration and environment
    # -------------------------------------------------------------------------
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "omegaconf>=2.3.1",

    # -------------------------------------------------------------------------
    # Auth / JWT
    # -------------------------------------------------------------------------
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "python-jose[cryptography]>=3.3.0",

    # -------------------------------------------------------------------------
    # CLI and UI utilities
    # -------------------------------------------------------------------------
    "click>=8.4.1",
    "typer>=0.24.2",
    "tabulate>=0.10.0",
    "prompt-toolkit>=3.0.52",
    "streamlit>=1.30.0",

    # -------------------------------------------------------------------------
    # Serialisation / data formats
    # -------------------------------------------------------------------------
    "orjson>=3.11.9",
    "jsonschema>=4.26.0",
    "jsonpath-ng>=1.8.0",

    # -------------------------------------------------------------------------
    # General utilities
    # -------------------------------------------------------------------------
    "tenacity>=9.1.4",
    "backoff>=2.2.1",
    "python-dateutil>=2.9.0",
    "tqdm>=4.68.3",
    "typing-extensions>=4.15.0",
    "packaging>=26.2",
    "psutil>=7.2.2",
    "faker>=40.23.0",
    "regex>=2026.5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
# Heavy optional extractor — install only if docling/PyMuPDF are insufficient
full = [
    "unstructured[pdf,docx]>=0.14.0",
]

[tool.uv]
# Virtual project: uv manages the environment without building/installing
# this directory as a Python package. Run from the workspace root:
#   uv venv
#   uv sync              # production deps
#   uv sync --extra dev  # + test tools
package = false
# Restrict resolution to Windows: docling-core>=2.83.1 applies a macOS-only
# marker that caps transformers<5.9.0, conflicting with transformers>=5.12.1.
# That constraint is darwin-only and irrelevant on this platform.
environments = ["sys_platform == 'win32'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent-mesh/tests", "rag-as-a-service/tests"]
