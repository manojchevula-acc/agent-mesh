[pytest]
# pytest-asyncio 1.x requires explicit asyncio_mode (was implicit in 0.x).
# "auto" marks all async test functions without needing @pytest.mark.asyncio.
asyncio_mode = auto

# Always run from the project root so relative src/ imports resolve correctly.
testpaths = .

# Show short summary of failed/errored tests.
addopts = -v --tb=short
