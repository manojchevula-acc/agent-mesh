fields:
  - {name: BUSINESS_DOMAIN, key: gernas.business_domain, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-006, brief: Line of business that owns the use case, example: retail_pricing}
  - {name: USE_CASE_ID, key: gernas.use_case_id, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-006, brief: Registered GERNAS use-case identifier, example: UC-PRICING-001}
  - {name: APPLICATION_ID, key: gernas.application_id, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-006, brief: Application hosting the use case, example: agent-mesh}
