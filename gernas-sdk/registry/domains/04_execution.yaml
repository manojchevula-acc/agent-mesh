domain: execution
blueprint: true
owner: GERNAS OS
brief: Run and session identifiers. trace_id and span_id are the native W3C span context (Blueprint §1 "standard trace/span context"), not attributes.
fields:
  - {name: AGENT_RUN_ID, key: gernas.agent_run_id, type: string, required: always, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, source: GERNAS-REQ-009, brief: Unique id of one agent run - new for every run, example: run_7f3c}
  - {name: SESSION_ID, key: gernas.session_id, type: string, required: conditional, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, source: GERNAS-REQ-009, brief: Conversation session spanning many runs (set by the channel), example: sess_a1}
  - {name: TASK_ID, key: gernas.task_id, type: string, required: conditional, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, source: GERNAS-REQ-009, brief: Work item, possibly shared across agents, example: task_9}
  - {name: TRACE_ID, key: trace_id, native: true, type: string, required: always, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, source: GERNAS-REQ-003, brief: W3C trace id (span context - not an attribute), example: 4bf92f3577b34da6a3ce929d0e0e4736}
  - {name: SPAN_ID, key: span_id, native: true, type: string, required: always, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, source: GERNAS-REQ-003, brief: W3C span id (span context - not an attribute), example: 00f067aa0ba902b7}
