domain: human_approval
owner: FAB DAI
brief: Human-in-the-loop approvals. Approver role only, never the individual (gap-analysis domain).
fields:
  - {name: HITL_TICKET_ID, key: gernas.hitl.ticket_id, type: string, required: always, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, brief: Approval ticket id, example: hitl_1}
  - {name: HITL_ACTION, key: gernas.hitl.action, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, brief: Action awaiting approval, example: submit_pricing_change}
  - {name: HITL_OUTCOME, key: gernas.hitl.outcome, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, enum: [approved, rejected, changed, timed_out], brief: Approval outcome, example: approved}
  - {name: HITL_WAITED_MS, key: gernas.hitl.waited_ms, type: double, required: always, sensitivity: internal, cardinality: unbounded, rollup: false, action: keep, brief: Time spent waiting for the human, example: 64000}
  - {name: HITL_APPROVER_ROLE, key: gernas.hitl.approver_role, type: string, required: conditional, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, brief: Role of the approver (never identity), example: credit_officer}
  - {name: HITL_TIMEOUT_S, key: gernas.hitl.timeout_s, type: double, required: conditional, sensitivity: internal, cardinality: bounded, rollup: false, action: keep, brief: Configured approval timeout, example: 300}
