domain: agent
blueprint: true
owner: GERNAS OS
brief: Identity of the agent producing the run.
fields:
  - {name: AGENT_ID, key: gernas.agent_id, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-008, brief: Registered agent identifier, example: price_assist}
  - {name: AGENT_NAME, key: gernas.agent_name, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: false, action: keep, source: GERNAS-REQ-008, brief: Human-readable agent name, example: PriceAssist}
  - {name: AGENT_VERSION, key: gernas.agent_version, type: string, required: always, sensitivity: internal, cardinality: growing, rollup: true, action: keep, source: GERNAS-REQ-008, brief: Deployed agent version, example: "1.4.0"}
  - {name: AGENT_TYPE, key: gernas.agent_type, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-008, brief: Role of the agent (e.g. orchestrator / worker / gate), example: worker}
