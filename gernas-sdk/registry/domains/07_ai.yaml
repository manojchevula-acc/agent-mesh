domain: ai
blueprint: true
owner: LLM Gateway
brief: Model identity for every model / embedding call.
fields:
  - {name: PROVIDER, key: gernas.provider, type: string, required: always, sensitivity: public, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-012, brief: Model provider, example: azure_openai}
  - {name: MODEL_ID, key: gernas.model_id, type: string, required: always, sensitivity: public, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-012, brief: Requested model, example: gpt-4o}
  - {name: DEPLOYMENT_ID, key: gernas.deployment_id, type: string, required: conditional, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-012, brief: Model deployment (PTU / paygo) id, example: paygo-uae}
  - {name: MODEL_VERSION, key: gernas.model_version, type: string, required: conditional, sensitivity: public, cardinality: growing, rollup: true, action: keep, source: GERNAS-REQ-012, brief: Model version reported by the provider response, example: gpt-4o-2024-08-06}
