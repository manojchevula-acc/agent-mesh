domain: tool
blueprint: true
owner: Skills/Tools platform
brief: Tool, API and MCP invocations (MCP is a tool_type, Blueprint Fig. 1 "API & Tool Layer - APIs / MCP / Skills").
fields:
  - {name: TOOL_ID, key: gernas.tool_id, type: string, required: always, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-011, brief: Registered tool identifier, example: customer_360}
  - {name: TOOL_TYPE, key: gernas.tool_type, type: string, required: always, sensitivity: public, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-011, brief: Tool category (e.g. function / mcp / api / a2a), example: mcp}
  - {name: TOOL_VERSION, key: gernas.tool_version, type: string, required: conditional, sensitivity: internal, cardinality: growing, rollup: true, action: keep, source: GERNAS-REQ-011, brief: Tool version, example: "1"}
  - {name: API_OPERATION, key: gernas.api_operation, type: string, required: conditional, sensitivity: internal, cardinality: bounded, rollup: true, action: keep, source: GERNAS-REQ-011, brief: Remote API operation invoked by the tool, example: GET /customers}
