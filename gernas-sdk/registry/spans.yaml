version: "2026.10.1"

# Span catalogue. The Blueprint defines no span names; these are the SDK convention.
# One operation per GERNAS concept — MAF, LangChain, LangGraph and custom code all map
# onto the same spans (framework only differs in gernas.framework).
#
# envelope    : set on every span the SDK creates (Blueprint §2 "every telemetry signal").
# run_context : additionally set on every span created inside an agent run (Blueprint §6
#               "every model call attributable to ... Agent → Agent Run").
# resource    : stamped once per process.
envelope: [BUSINESS_DOMAIN, USE_CASE_ID, APPLICATION_ID, ENVIRONMENT, OPERATION, EXECUTION_STATUS]
run_context: [AGENT_ID, AGENT_RUN_ID]
resource: [SDK_VERSION, BUSINESS_DOMAIN, USE_CASE_ID, APPLICATION_ID, ENVIRONMENT]

# Mandatory blueprint context `gernas doctor` verifies on its test agent run.
doctor_context: [BUSINESS_DOMAIN, USE_CASE_ID, APPLICATION_ID, AGENT_ID, AGENT_NAME, AGENT_VERSION, AGENT_TYPE, AGENT_RUN_ID, ENVIRONMENT, EXECUTION_STATUS, TERMINATION_REASON, SDK_VERSION]

spans:
  - {op: USE_CASE, name: use_case.request, api: trace_use_case, kind: SERVER, source: GERNAS-REQ-021, required: [USE_CASE_ID, APPLICATION_ID, BUSINESS_DOMAIN]}
  - {op: AGENT, name: agent.run, api: trace_agent, kind: INTERNAL, source: GERNAS-REQ-022, required: [AGENT_ID, AGENT_NAME, AGENT_VERSION, AGENT_TYPE, AGENT_RUN_ID, TERMINATION_REASON, STEP_COUNT, RETRY_COUNT]}
  - {op: STEP, name: agent.step, api: trace_step, kind: INTERNAL, source: GERNAS-REQ-010, required: [STEP_ID, STEP_TYPE, ATTEMPT_NUMBER]}
  - {op: PLANNING, name: agent.plan, api: trace_planning, kind: INTERNAL, source: GERNAS-REQ-022, required: [PLAN_ID, ATTEMPT_NUMBER]}
  - {op: DELEGATION, name: agent.delegate, api: trace_delegation, kind: CLIENT, source: GERNAS-REQ-023, required: [PARENT_AGENT_ID, CHILD_AGENT_ID, DELEGATION_PATH]}
  - {op: LLM, name: llm.call, api: trace_llm, kind: CLIENT, source: GERNAS-REQ-025, required: [PROVIDER, MODEL_ID]}
  - {op: EMBEDDING, name: embedding.create, api: trace_embedding, kind: CLIENT, source: GERNAS-REQ-026, required: [PROVIDER, MODEL_ID, BATCH_SIZE]}
  - {op: TOOL, name: tool.call, api: trace_tool, kind: CLIENT, source: GERNAS-REQ-024, required: [TOOL_ID, TOOL_TYPE, AUTHORIZATION_DECISION]}
  - {op: RETRIEVAL, name: retrieval.search, api: trace_retrieval, kind: CLIENT, source: GERNAS-REQ-028, required: [RESULT_COUNT, EMPTY_RESULT]}
  - {op: MEMORY, name: memory.access, api: trace_memory, kind: INTERNAL, source: GERNAS-REQ-029, required: [MEMORY_OPERATION]}
  - {op: GUARDRAIL, name: guardrail.check, api: trace_guardrail, kind: INTERNAL, source: GERNAS-REQ-015, required: [POLICY_ID, POLICY_DECISION]}
  - {op: CONTENT_SAFETY, name: content_safety.check, api: trace_content_safety, kind: INTERNAL, source: GERNAS-REQ-027, required: [SAFETY_CATEGORY, CONTENT_BLOCKED]}
  - {op: DOCUMENT, name: document.process, api: trace_document, kind: INTERNAL, source: GERNAS-REQ-043, required: [DOCUMENT_TYPE, DOCUMENT_STATUS]}
  - {op: EVALUATION, name: evaluation.score, api: record_evaluation, kind: INTERNAL, source: GERNAS-REQ-041, required: [EVALUATION_METRIC, EVALUATION_SCORE]}
  - {op: HITL, name: hitl.approval, api: trace_hitl / start_hitl, kind: INTERNAL, source: GERNAS-REQ-031, required: [HITL_TICKET_ID, HITL_ACTION, HITL_OUTCOME]}
  - {op: HTTP, name: "{method} {route}", api: GernasASGIMiddleware, kind: SERVER, source: TN-03, required: [HTTP_METHOD, HTTP_ROUTE, HTTP_STATUS_CODE]}

# Span events: none are GERNAS-defined. The only event the SDK records is the OTel
# standard "exception" event (record_exception) on failed operations.
