[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gernas-telemetry"
dynamic = ["version"]
description = "Gernas SDK — GERNAS Enterprise Telemetry Blueprint on OpenTelemetry: one telemetry model for MAF, LangChain, LangGraph and custom Python agents"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FAB-Proprietary"
# Engineering principle 1: OTel SDK primitives only. No opentelemetry-instrumentation-*
# package may appear here (enforced by tests/packaging/test_packaging.py).
dependencies = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-semantic-conventions>=0.45b0",
]

[project.optional-dependencies]
# Framework adapters — each optional; the core imports none of them.
agent-framework = ["agent-framework>=1.0.0"]
a2a = ["a2a-sdk>=1.0.0"]
langchain = ["langchain-core>=0.2.0"]
langgraph = ["langgraph>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",      # registry/generate.py
    "mypy>=1.8",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
gernas = "gernas.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gernas._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gernas*"]

[tool.setuptools.package-data]
gernas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["gernas"]
patch = ["subprocess"]   # measure the CLI / collector-down / cross-process subprocess tests too

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/gernas/attributes.py" = ["E501"]   # generated tables

[tool.ruff.lint.isort]
known-first-party = ["gernas"]
known-local-folder = ["conftest"]

[tool.ruff.format]
exclude = ["src/gernas/attributes.py"]   # generated by registry/generate.py

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
