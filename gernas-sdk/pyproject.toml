[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gernas-telemetry"
dynamic = ["version"]
description = "Gernas SDK — GERNAS Agent Telemetry SDK: OpenTelemetry-primitive decorators, PDPL redaction and Collector-first export for agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FAB-Proprietary"
# Engineering principle 1: OTel SDK primitives only. No opentelemetry-instrumentation-*
# package may appear here (enforced by tests/test_packaging.py).
dependencies = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-semantic-conventions>=0.45b0",
]

[project.optional-dependencies]
pretty = ["rich>=13.0"]
audit = ["reportlab>=4.0"]
breaker = ["pybreaker>=1.0"]
langchain = ["langchain-core>=0.2.0"]
agent-framework = ["agent-framework>=1.0.0", "a2a-sdk>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "rich>=13.0",
    "langchain-core>=0.2.0",
    "build>=1.0",
]

[project.scripts]
gernas = "gernas.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gernas._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gernas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["gernas"]
patch = ["subprocess"]   # measure the CLI / collector-down / cross-process subprocess tests too
omit = ["gernas/core/html_reporter.py", "gernas/core/audit_report.py", "gernas/core/pretty_exporter.py",
        "gernas/circuit_breaker/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
