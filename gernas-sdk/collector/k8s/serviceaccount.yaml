# Identity of the Collector pod. Azure Workload Identity federates this ServiceAccount
# with an Entra ID application / user-assigned managed identity that has ADX ingest rights,
# so no ADX secret is stored in the cluster. No Kubernetes API access is needed (no RBAC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gernas-otel-collector
  annotations:
    azure.workload.identity/client-id: "<collector-managed-identity-client-id>"
automountServiceAccountToken: false
