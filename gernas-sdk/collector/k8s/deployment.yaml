apiVersion: apps/v1
kind: Deployment
metadata:
  name: gernas-otel-collector
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        azure.workload.identity/use: "true"      # injects AZURE_CLIENT_ID / TENANT_ID / token file
    spec:
      serviceAccountName: gernas-otel-collector
      terminationGracePeriodSeconds: 30          # lets batch / sending queues drain on shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: gateway
      containers:
        - name: otel-collector
          # Same version as the binary the config was validated with (otelcol-contrib 0.162.0).
          image: otel/opentelemetry-collector-contrib:0.162.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/otel-collector-config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
            - {name: metrics, containerPort: 8888, protocol: TCP}
          env:
            - name: GERNAS_COLLECTOR_BIND
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: GOMEMLIMIT                    # keep Go GC below the container limit
              value: "400MiB"
          envFrom:
            - configMapRef: {name: gernas-otel-collector-env}
            - secretRef: {name: opik-credentials}  # OPIK_API_KEY, OPIK_WORKSPACE, OPIK_PROJECT_NAME
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: gernas-otel-collector-config
