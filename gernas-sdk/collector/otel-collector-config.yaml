# GERNAS OTel Collector — local / dev gateway configuration.
#
#   SDK (gernas) --OTLP--> this Collector --+--> data plane   (file exporter: R1 store not yet selected)
#                                           +--> Opik Cloud    (OTLP/HTTP protobuf, traces only)
#
# Covers: OTLP receivers (gRPC :4317 / HTTP :4318, 8 MiB cap) · registry-generated denylist +
#   deny-by-default allow-list + PII value masks · tail sampling that always keeps errors,
#   policy denials and HITL decisions · Opik span shape · self-metrics on :8888.
# Not covered here (see docs/collector-topology.md): TLS/OIDC, HA gateway, k8sattributes, registry enrichment.
#
# Every secret comes from the environment (scripts/run_collector.ps1 loads agent-mesh/.env):
#   OPIK_API_KEY, OPIK_WORKSPACE, OPIK_PROJECT_NAME
# Run:  collector/bin/otelcol-contrib.exe --config collector/otel-collector-config.yaml

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Registry rows with action=drop plus registry/denylist.yaml: never stored (PDPL).
  attributes/pdpl:
    actions:
      # >>> GERNAS-DENYLIST (generated by registry/generate.py - do not edit)
      - {key: enduser.id, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
      - {key: gen_ai.tool.call.arguments, action: delete}
      - {key: gen_ai.tool.call.result, action: delete}
      - {key: gernas.user_id, action: delete}
      # <<< GERNAS-DENYLIST

  # Deny by default: any attribute not in the registry-generated
  # allow-list is removed; PII patterns are masked in the values that remain.
  redaction/deny_by_default:
    allow_all_keys: false
    allowed_keys:
      # >>> GERNAS-ALLOWLIST (generated by registry/generate.py - do not edit)
      - agent_framework.function.name
      - deployment.environment.name
      - edge_group.id
      - edge_group.type
      - error.message
      - exception.escaped
      - exception.message
      - exception.stacktrace
      - exception.type
      - executor.id
      - executor.type
      - gen_ai.agent.description
      - gen_ai.agent.id
      - gen_ai.agent.name
      - gen_ai.conversation.id
      - gen_ai.output.type
      - gen_ai.request.max_tokens
      - gen_ai.request.temperature
      - gen_ai.request.top_p
      - gen_ai.response.id
      - gen_ai.system
      - gen_ai.token.type
      - gen_ai.tool.call.id
      - gen_ai.tool.description
      - gen_ai.tool.type
      - gen_ai.usage.cache_read.input_tokens
      - gen_ai.usage.reasoning.output_tokens
      - gernas.agent_id
      - gernas.agent_name
      - gernas.agent_run_id
      - gernas.agent_type
      - gernas.agent_version
      - gernas.api_operation
      - gernas.application_id
      - gernas.attempt_number
      - gernas.authorization_decision
      - gernas.batch_size
      - gernas.business_domain
      - gernas.business_outcome
      - gernas.channel
      - gernas.child_agent_id
      - gernas.cluster
      - gernas.compute_units
      - gernas.content_blocked
      - gernas.delegation_path
      - gernas.department
      - gernas.dependency
      - gernas.deployment_id
      - gernas.empty_result
      - gernas.environment
      - gernas.error_category
      - gernas.estimated_cost
      - gernas.execution_status
      - gernas.fallback_used
      - gernas.framework
      - gernas.hitl_action
      - gernas.hitl_approver_role
      - gernas.hitl_outcome
      - gernas.hitl_ticket_id
      - gernas.index_id
      - gernas.knowledge_domain
      - gernas.loop_detected
      - gernas.loop_repeat_count
      - gernas.max_step_violation
      - gernas.memory_hit
      - gernas.memory_operation
      - gernas.memory_size_bytes
      - gernas.memory_stale
      - gernas.model_id
      - gernas.model_version
      - gernas.namespace
      - gernas.operation
      - gernas.parent_agent_id
      - gernas.parent_run_id
      - gernas.plan_id
      - gernas.plan_step_count
      - gernas.pod
      - gernas.policy_decision
      - gernas.policy_id
      - gernas.policy_triggered
      - gernas.principal_type
      - gernas.prompt_template_id
      - gernas.prompt_version
      - gernas.provider
      - gernas.query_rewritten
      - gernas.ranking_score
      - gernas.redaction_applied
      - gernas.region
      - gernas.request_size_bytes
      - gernas.request_type
      - gernas.response_size_bytes
      - gernas.result_count
      - gernas.retrieval_strategy
      - gernas.retry_count
      - gernas.risk_classification
      - gernas.risk_level
      - gernas.safety_category
      - gernas.sdk_version
      - gernas.session_id
      - gernas.source_id
      - gernas.step_count
      - gernas.step_id
      - gernas.step_type
      - gernas.stop_reason
      - gernas.task_id
      - gernas.tenant
      - gernas.termination_reason
      - gernas.token_cached
      - gernas.token_input
      - gernas.token_output
      - gernas.token_type
      - gernas.tokenized_user_id
      - gernas.tokens_per_second
      - gernas.tool_id
      - gernas.tool_type
      - gernas.tool_version
      - gernas.top_k
      - gernas.ttft_ms
      - gernas.use_case_id
      - host.name
      - http.request.method
      - http.response.status_code
      - http.route
      - k8s.namespace.name
      - k8s.pod.name
      - message.source_id
      - message.target_id
      - message.type
      - server.address
      - server.port
      - service.instance.id
      - service.name
      - service.namespace
      - service.version
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      - url.path
      - workflow.id
      - workflow.name
      # <<< GERNAS-ALLOWLIST
    blocked_values:
      - "784-?[0-9]{4}-?[0-9]{7}-?[0-9]"            # Emirates ID
      - "AE[0-9]{2}(?: ?[0-9]){19}"                  # UAE IBAN
      - "\\b(?:[0-9][ -]?){12,18}[0-9]\\b"          # card numbers (13-19 digits)
      - "Bearer [A-Za-z0-9._~+/=-]+"                 # bearer tokens
      - "\\b(?:sk|gsk|pk|rk)[-_][A-Za-z0-9_-]{16,}"  # provider API keys
    summary: info

  # Data-plane sampling: wait for the run, never sample away errors,
  # policy blocks, human approvals or high-risk runs.
  tail_sampling/dataplane:
    decision_wait: ${env:GERNAS_TAIL_DECISION_WAIT:-5s}
    num_traces: 50000
    policies:
      - name: always_errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: always_high_risk
        type: string_attribute
        string_attribute: {key: gernas.risk_level, values: [high]}
      - name: always_policy_block
        type: string_attribute
        string_attribute: {key: gernas.policy_decision, values: [deny]}
      - name: always_hitl
        type: string_attribute
        string_attribute: {key: gernas.hitl_outcome, values: [approved, rejected, timed_out]}
      - name: baseline_success
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:GERNAS_BASELINE_SAMPLE_PERCENT:-100}

  # Opik copy: 100% in dev; lower it per environment.
  probabilistic_sampler/opik:
    sampling_percentage: ${env:GERNAS_OPIK_SAMPLE_PERCENT:-100}

  # Opik span shape: Opik reads OTel GenAI keys while the SDK emits GERNAS keys only,
  # so the vendor mapping lives in the Collector (runs after redaction).
  transform/opik_shape:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.request.model"], attributes["gernas.model_id"]) where attributes["gernas.model_id"] != nil
          - set(attributes["gen_ai.provider.name"], attributes["gernas.provider"]) where attributes["gernas.provider"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gernas.token_input"]) where attributes["gernas.token_input"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gernas.token_output"]) where attributes["gernas.token_output"] != nil
          - set(attributes["thread_id"], attributes["gernas.session_id"]) where attributes["gernas.session_id"] != nil

  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  # Data-plane placeholder: the data-plane store is not yet selected.
  # One file per signal class so each class lands in its own "schema".
  file/dataplane_traces:
    path: ${env:GERNAS_COLLECTOR_OUT:-./collector/out}/dataplane-traces.json
  file/dataplane_metrics:
    path: ${env:GERNAS_COLLECTOR_OUT:-./collector/out}/dataplane-metrics.json
  file/dataplane_logs:
    path: ${env:GERNAS_COLLECTOR_OUT:-./collector/out}/dataplane-logs.json

  otlphttp/opik:
    endpoint: ${env:OPIK_OTLP_ENDPOINT:-https://www.comet.com/opik/api/v1/private/otel}
    encoding: proto
    headers:
      Authorization: ${env:OPIK_API_KEY}
      Comet-Workspace: ${env:OPIK_WORKSPACE}
      projectName: ${env:OPIK_PROJECT_NAME}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 2048

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pdpl, redaction/deny_by_default, tail_sampling/dataplane, batch]
      exporters: [file/dataplane_traces, debug]
    traces/opik:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pdpl, redaction/deny_by_default, probabilistic_sampler/opik, transform/opik_shape, batch]
      exporters: [otlphttp/opik]
    metrics/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/dataplane_metrics]
    logs/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pdpl, batch]
      exporters: [file/dataplane_logs]
