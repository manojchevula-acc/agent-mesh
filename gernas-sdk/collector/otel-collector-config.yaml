# GERNAS OTel Collector — gateway configuration (AKS pod; also used for local runs).
#
#   Gernas SDK --OTLP gRPC/HTTP--> Collector --+--> Azure Data Explorer (data plane: traces, metrics, logs)
#                                              +--> Opik Cloud (developer trace view: traces only, OTLP/HTTP)
#
# Pipeline (Blueprint §1 Figure 1: collection & processing):
#   memory_limiter → PII/secret control (registry-generated denylist, deny-by-default allow-list,
#   value masks) → sampling → vendor shape (Opik only) → batch → exporters.
#
# Every endpoint and secret comes from the environment (never from this file):
#   ADX_CLUSTER_URI, ADX_DATABASE                    data plane
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE
#                                                    ADX auth (AKS Workload Identity, injected by
#                                                    the webhook) — or a service principal via
#                                                    AZURE_CLIENT_SECRET for non-AKS runs
#   OPIK_API_KEY, OPIK_WORKSPACE, OPIK_PROJECT_NAME  Opik (Kubernetes Secret)
#   GERNAS_COLLECTOR_BIND                            listen address (0.0.0.0 in the pod, 127.0.0.1 locally)
# Validate:  collector/bin/otelcol-contrib validate --config collector/otel-collector-config.yaml
# Deploy:    kubectl apply -k collector/   (see docs/operations/collector-aks-deployment.md)

extensions:
  health_check:
    endpoint: ${env:GERNAS_COLLECTOR_BIND:-0.0.0.0}:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:GERNAS_COLLECTOR_BIND:-0.0.0.0}:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: ${env:GERNAS_COLLECTOR_BIND:-0.0.0.0}:4318

processors:
  # Container-aware: limits are a share of the pod memory limit (cgroup).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Registry rows with action=drop plus registry/denylist.yaml: never stored (PDPL).
  attributes/pdpl:
    actions:
      # >>> GERNAS-DENYLIST (generated by registry/generate.py - do not edit)
      - {key: enduser.id, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
      - {key: gen_ai.tool.call.arguments, action: delete}
      - {key: gen_ai.tool.call.result, action: delete}
      - {key: gernas.user_id, action: delete}
      # <<< GERNAS-DENYLIST

  # Deny by default: any attribute not in the registry-generated allow-list is removed;
  # PII / secret patterns are masked in the values that remain.
  redaction/deny_by_default:
    allow_all_keys: false
    allowed_keys:
      # >>> GERNAS-ALLOWLIST (generated by registry/generate.py - do not edit)
      - agent_framework.function.name
      - deployment.environment.name
      - edge_group.id
      - edge_group.type
      - error.message
      - exception.escaped
      - exception.message
      - exception.stacktrace
      - exception.type
      - executor.id
      - executor.type
      - gen_ai.agent.description
      - gen_ai.agent.id
      - gen_ai.agent.name
      - gen_ai.conversation.id
      - gen_ai.output.type
      - gen_ai.request.max_tokens
      - gen_ai.request.temperature
      - gen_ai.request.top_p
      - gen_ai.response.id
      - gen_ai.system
      - gen_ai.token.type
      - gen_ai.tool.call.id
      - gen_ai.tool.description
      - gen_ai.tool.type
      - gen_ai.usage.cache_read.input_tokens
      - gen_ai.usage.reasoning.output_tokens
      - gernas.agent_id
      - gernas.agent_name
      - gernas.agent_run_id
      - gernas.agent_type
      - gernas.agent_version
      - gernas.api_operation
      - gernas.application_id
      - gernas.attempt_number
      - gernas.authorization_decision
      - gernas.batch_size
      - gernas.business_domain
      - gernas.business_outcome
      - gernas.channel
      - gernas.child_agent_id
      - gernas.chunk_count
      - gernas.cluster
      - gernas.compute_units
      - gernas.content_blocked
      - gernas.delegation_path
      - gernas.department
      - gernas.dependency
      - gernas.deployment_id
      - gernas.document_status
      - gernas.document_type
      - gernas.document_version
      - gernas.empty_result
      - gernas.environment
      - gernas.error_category
      - gernas.estimated_cost
      - gernas.evaluation_metric
      - gernas.evaluation_passed
      - gernas.evaluation_score
      - gernas.evaluator
      - gernas.execution_status
      - gernas.fallback_used
      - gernas.framework
      - gernas.hitl_action
      - gernas.hitl_approver_role
      - gernas.hitl_outcome
      - gernas.hitl_ticket_id
      - gernas.index_id
      - gernas.knowledge_domain
      - gernas.loop_detected
      - gernas.loop_repeat_count
      - gernas.max_step_violation
      - gernas.memory_hit
      - gernas.memory_operation
      - gernas.memory_size_bytes
      - gernas.memory_stale
      - gernas.model_id
      - gernas.model_version
      - gernas.namespace
      - gernas.operation
      - gernas.parent_agent_id
      - gernas.parent_run_id
      - gernas.plan_id
      - gernas.plan_step_count
      - gernas.pod
      - gernas.policy_decision
      - gernas.policy_id
      - gernas.policy_triggered
      - gernas.principal_type
      - gernas.prompt_template_id
      - gernas.prompt_version
      - gernas.provider
      - gernas.query_rewritten
      - gernas.ranking_score
      - gernas.redaction_applied
      - gernas.region
      - gernas.request_size_bytes
      - gernas.request_type
      - gernas.response_size_bytes
      - gernas.result_count
      - gernas.retrieval_strategy
      - gernas.retry_count
      - gernas.risk_classification
      - gernas.risk_level
      - gernas.safety_category
      - gernas.sdk_version
      - gernas.session_id
      - gernas.source_id
      - gernas.step_count
      - gernas.step_id
      - gernas.step_type
      - gernas.stop_reason
      - gernas.task_id
      - gernas.tenant
      - gernas.termination_reason
      - gernas.token_cached
      - gernas.token_input
      - gernas.token_output
      - gernas.token_type
      - gernas.tokenized_user_id
      - gernas.tokens_per_second
      - gernas.tool_id
      - gernas.tool_type
      - gernas.tool_version
      - gernas.top_k
      - gernas.ttft_ms
      - gernas.use_case_id
      - host.name
      - http.request.method
      - http.response.status_code
      - http.route
      - k8s.namespace.name
      - k8s.pod.name
      - message.source_id
      - message.target_id
      - message.type
      - server.address
      - server.port
      - service.instance.id
      - service.name
      - service.namespace
      - service.version
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      - url.path
      - workflow.id
      - workflow.name
      # <<< GERNAS-ALLOWLIST
    blocked_values:
      - "784-?[0-9]{4}-?[0-9]{7}-?[0-9]"            # Emirates ID
      - "AE[0-9]{2}(?: ?[0-9]){19}"                  # UAE IBAN
      - "\\b(?:[0-9][ -]?){12,18}[0-9]\\b"          # card numbers (13-19 digits)
      - "Bearer [A-Za-z0-9._~+/=-]+"                 # bearer tokens
      - "\\b(?:sk|gsk|pk|rk)[-_][A-Za-z0-9_-]{16,}"  # provider API keys
    summary: info

  # Data plane: wait for the whole trace; never sample away errors, policy blocks,
  # high-risk content or human approvals.
  tail_sampling/dataplane:
    decision_wait: ${env:GERNAS_TAIL_DECISION_WAIT:-10s}
    num_traces: 50000
    policies:
      - name: always_errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: always_high_risk
        type: string_attribute
        string_attribute: {key: gernas.risk_level, values: [high]}
      - name: always_policy_block
        type: string_attribute
        string_attribute: {key: gernas.policy_decision, values: [deny]}
      - name: always_hitl
        type: string_attribute
        string_attribute: {key: gernas.hitl_outcome, values: [approved, rejected, timed_out]}
      - name: baseline_success
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:GERNAS_BASELINE_SAMPLE_PERCENT:-100}

  # Opik copy: 100% by default; lower it per environment.
  probabilistic_sampler/opik:
    sampling_percentage: ${env:GERNAS_OPIK_SAMPLE_PERCENT:-100}

  # Opik span shape: Opik reads OTel GenAI keys while the SDK emits GERNAS keys only,
  # so the vendor mapping lives in the Collector (runs after redaction).
  transform/opik_shape:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.request.model"], attributes["gernas.model_id"]) where attributes["gernas.model_id"] != nil
          - set(attributes["gen_ai.provider.name"], attributes["gernas.provider"]) where attributes["gernas.provider"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gernas.token_input"]) where attributes["gernas.token_input"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gernas.token_output"]) where attributes["gernas.token_output"] != nil
          - set(attributes["thread_id"], attributes["gernas.session_id"]) where attributes["gernas.session_id"] != nil

  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  # Data plane: Azure Data Explorer (tables from collector/adx/create-tables.kql).
  azuredataexplorer:
    cluster_uri: ${env:ADX_CLUSTER_URI}
    use_azure_auth: true
    db_name: ${env:ADX_DATABASE:-gernas_telemetry}
    traces_table_name: OTELTraces
    metrics_table_name: OTELMetrics
    logs_table_name: OTELLogs
    ingestion_type: queued
    timeout: 30s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 10m

  # Developer trace view: Opik Cloud OTLP endpoint (HTTP only, traces only).
  otlphttp/opik:
    endpoint: ${env:OPIK_OTLP_ENDPOINT:-https://www.comet.com/opik/api/v1/private/otel}
    encoding: proto
    headers:
      Authorization: ${env:OPIK_API_KEY}
      Comet-Workspace: ${env:OPIK_WORKSPACE}
      projectName: ${env:OPIK_PROJECT_NAME}
    timeout: 30s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      queue_size: 2048

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed          # otelcol_exporter_send_failed_*, queue size, refused spans …
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:GERNAS_COLLECTOR_BIND:-0.0.0.0}
                port: 8888
  pipelines:
    traces/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pdpl, redaction/deny_by_default, tail_sampling/dataplane, batch]
      exporters: [azuredataexplorer]
    traces/opik:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pdpl, redaction/deny_by_default, probabilistic_sampler/opik, transform/opik_shape, batch]
      exporters: [otlphttp/opik]
    metrics/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [azuredataexplorer]
    logs/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pdpl, batch]
      exporters: [azuredataexplorer]
