# GERNAS OTel Collector — local / dev gateway configuration.
#
#   SDK (gernas) --OTLP--> this Collector --+--> data plane   (file exporter: R1 store not yet selected)
#                                           +--> Opik Cloud    (OTLP/HTTP protobuf, traces only)
#
# Covers the SDK-side WP1-CORE-06 needs and a dev subset of WP2-A:
#   A-02 receivers (gRPC :4317 / HTTP :4318, 8 MiB cap) · A-04 deny-by-default redaction + PII patterns
#   A-06 tail sampling with always-keep rules + per-signal routing · A-07 self-metrics on :8888
#   CORE-06 per-destination kill switches (resource gernas.route.*) + Opik span shape.
# Not covered here (see docs/collector-topology.md): TLS/OIDC, HA gateway, k8sattributes, registry enrichment.
#
# Every secret comes from the environment (scripts/run_collector.ps1 loads agent-mesh/.env):
#   OPIK_API_KEY, OPIK_WORKSPACE, OPIK_PROJECT_NAME
# Run:  collector/bin/otelcol-contrib.exe --config collector/otel-collector-config.yaml

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Kill switches (WP1-CORE-06 step 1): the SDK stamps gernas.route.* from
  # GERNAS_EMIT_OPIK / GERNAS_EMIT_DATAPLANE onto the resource; no agent code change.
  filter/route_opik:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["gernas.route.opik"] == false
  filter/route_dataplane:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["gernas.route.dataplane"] == false
    metrics:
      datapoint:
        - resource.attributes["gernas.route.dataplane"] == false
    logs:
      log_record:
        - resource.attributes["gernas.route.dataplane"] == false

  # PDPL matrix rows with action != keep (registry/redaction-matrix.yaml).
  attributes/pdpl:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
      - {key: gen_ai.tool.call.arguments, action: delete}
      - {key: gen_ai.tool.call.result, action: delete}
      - {key: gernas.user_id, action: delete}
      - {key: enduser.id, action: delete}
      - {key: gernas.tokenised_user_id, action: hash}

  # Deny by default (WP2-A-04 step 2): any attribute not in the registry-generated
  # allow-list is removed; PII patterns are masked in the values that remain.
  redaction/deny_by_default:
    allow_all_keys: false
    allowed_keys:
