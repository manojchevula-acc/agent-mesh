      - workflow.id
      - workflow.name
      # <<< GERNAS-ALLOWLIST
    blocked_values:
      - "784-?[0-9]{4}-?[0-9]{7}-?[0-9]"            # Emirates ID
      - "AE[0-9]{2}(?: ?[0-9]){19}"                  # UAE IBAN
      - "\\b(?:[0-9][ -]?){12,18}[0-9]\\b"          # card numbers (13-19 digits)
      - "Bearer [A-Za-z0-9._~+/=-]+"                 # bearer tokens
      - "\\b(?:sk|gsk|pk|rk)[-_][A-Za-z0-9_-]{16,}"  # provider API keys
    summary: info

  # Data-plane sampling (WP2-A-06): wait for the run, never sample away errors,
  # policy blocks, human approvals or high-risk runs.
  tail_sampling/dataplane:
    decision_wait: ${env:GERNAS_TAIL_DECISION_WAIT:-5s}
    num_traces: 50000
    policies:
      - name: always_errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: always_high_risk
        type: string_attribute
        string_attribute: {key: gernas.risk_tier, values: ["3", "4"]}
      - name: always_policy_block
        type: string_attribute
        string_attribute: {key: gernas.policy_decision, values: [deny]}
      - name: always_hitl
        type: string_attribute
        string_attribute: {key: gernas.hitl.outcome, values: [approved, rejected, timed_out, changed]}
      - name: baseline_success
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:GERNAS_BASELINE_SAMPLE_PERCENT:-100}

  # Opik copy: 100% in dev, 15% in staging/prod (WP1-CORE-06 step 3).
  probabilistic_sampler/opik:
    sampling_percentage: ${env:GERNAS_OPIK_SAMPLE_PERCENT:-100}

  # Opik span shape (WP1-CORE-06 step 2).
  transform/opik_shape:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["input"], attributes["gen_ai.prompt.redacted"]) where attributes["gen_ai.prompt.redacted"] != nil
          - set(attributes["output"], attributes["gen_ai.completion.redacted"]) where attributes["gen_ai.completion.redacted"] != nil
          - set(attributes["thread_id"], attributes["gernas.session_id"]) where attributes["gernas.session_id"] != nil

  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  # Data-plane placeholder (WP2-A-06 step 7): DATA PLANE STORE NOT SELECTED (risk R1).
  # One file per signal class so each class lands in its own "schema".
  file/dataplane_traces:
    path: ${env:GERNAS_COLLECTOR_OUT:-./collector/out}/dataplane-traces.json
  file/dataplane_metrics:
    path: ${env:GERNAS_COLLECTOR_OUT:-./collector/out}/dataplane-metrics.json
  file/dataplane_logs:
    path: ${env:GERNAS_COLLECTOR_OUT:-./collector/out}/dataplane-logs.json

  otlphttp/opik:
    endpoint: ${env:OPIK_OTLP_ENDPOINT:-https://www.comet.com/opik/api/v1/private/otel}
    encoding: proto
    headers:
      Authorization: ${env:OPIK_API_KEY}
      Comet-Workspace: ${env:OPIK_WORKSPACE}
      projectName: ${env:OPIK_PROJECT_NAME}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 2048

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, filter/route_dataplane, attributes/pdpl, redaction/deny_by_default, tail_sampling/dataplane, batch]
      exporters: [file/dataplane_traces, debug]
    traces/opik:
      receivers: [otlp]
      processors: [memory_limiter, filter/route_opik, attributes/pdpl, redaction/deny_by_default, probabilistic_sampler/opik, transform/opik_shape, batch]
      exporters: [otlphttp/opik]
    metrics/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, filter/route_dataplane, batch]
      exporters: [file/dataplane_metrics]
    logs/dataplane:
      receivers: [otlp]
      processors: [memory_limiter, filter/route_dataplane, attributes/pdpl, batch]
      exporters: [file/dataplane_logs]
