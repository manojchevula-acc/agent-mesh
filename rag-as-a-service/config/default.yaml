# Default values for all config keys.
# These mirror the Pydantic defaults; the YAML layer can override defaults and is
# itself overridden by environment variables / .env.
service_name: gernas-rag
service_version: "1.0.0"
environment: development
debug: false
log_level: INFO

api_host: 0.0.0.0
api_port: 8000
api_workers: 1
jwt_algorithm: RS256
cors_origins:
  - "*"

redis_url: redis://localhost:6379
redis_cache_ttl_seconds: 900
redis_enabled: true

embedding:
  provider: bgem3
  model_name: BAAI/bge-m3
  device: cpu
  use_fp16: true
  batch_size: 32
  max_length: 512
  dense_dim: 1024
  return_sparse: true
  normalize_embeddings: true

vectordb:
  provider: qdrant
  collection_name: fab_gernas_docs
  qdrant_url: http://localhost:6333
  qdrant_prefer_grpc: false
  qdrant_path:   # null = use qdrant_url; set to e.g. ./qdrant_storage for embedded local
  milvus_host: localhost
  milvus_port: 19530
  chroma_path: ./chroma_db
  chroma_port: 8001
  dense_vector_size: 1024
  distance_metric: cosine
  replication_factor: 1
  on_disk_payload: true

llm:
  provider: groq
  model_name: openai/gpt-oss-120b
  temperature: 0.0
  max_tokens: 2048
  timeout_seconds: 30
  hf_model_id: mistralai/Mistral-7B-Instruct-v0.2
  hf_device: cpu

chunking:
  strategy: hierarchical
  extraction_strategy: auto
  chunk_size: 400
  chunk_overlap: 64
  min_chunk_size: 80
  max_chunk_size: 600
  enable_parent_chunks: true
  parent_chunk_size: 1500
  unstructured_strategy: hi_res
  infer_table_structure: true

retrieval:
  dense_top_k: 40
  sparse_top_k: 40
  rrf_k: 60
  pre_rerank_top_k: 20
  final_top_k: 5
  freshness_penalty_enabled: true
  freshness_max_age_days: 180
  freshness_max_penalty: 0.3
  include_parent_chunks: true
  dense_weight: 0.6
  sparse_weight: 0.4

ingestion:
  docs_path: ./docs
  batch_size: 32
  max_concurrent_documents: 3
  supported_extensions:
    - .pdf
    - .docx

# ── Multimodal image-as-text extension (all additive, disabled by default) ──
enrichment:
  enabled: false                       # ingest-time figure/table captioning
  provider: anthropic                  # 'anthropic' | 'openai' | 'openai_compat'
  vlm_model_name: claude-haiku-4-5-20251001
  # Free-tier alternative for GPU-less laptops — no local model, just a remote call:
  #   provider: openai_compat
  #   vlm_model_name: gemini-flash-latest    # alias -> current stable Flash; pinned versions get deprecated
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  #   (set RAG__LLM__OPENAI_API_KEY to your Gemini API key — reused as the enrichment key)
  base_url:                            # only used when provider: openai_compat
  # Gemini "thinking" models spend part of this budget on hidden reasoning tokens
  # before writing any visible output (see thinking_budget:0 in vision_llm_enricher.py,
  # which disables that for Gemini specifically) — kept generous as a safety margin
  # for whatever budget the provider doesn't let us zero out.
  # raised 4096 -> 8192 -> 16384: even with reasoning_effort="low" on Gemini,
  # dense figures (multi-row fee schedules, dashboards) still clipped 3/21
  # captions at 8192 (eval stage2a CAPTION_TRUNCATED) — "transcribe every
  # visible value" on a busy chart is a genuinely long completion, not a
  # thinking-budget artifact.
  max_tokens: 16384
  # Raised alongside max_tokens: doubling the completion budget without raising
  # the wall-clock budget just trades a clean "clipped at max_tokens" failure
  # for a "Request timed out" one (observed on this exact re-ingest — a figure
  # that had a valid caption before got no caption at all this run, purely
  # because 20s wasn't enough time to generate up to the new 16384-token
  # ceiling). Now retried 3x via @async_retry regardless, but a timeout that
  # keeps failing all 3 attempts is worse than one that just runs long.
  timeout_seconds: 45
  min_image_bytes: 2048                # skip decorative logos/rules/icons
  table_confidence_threshold: 0.7
  max_concurrent: 4
  images_scale: 2.0
  max_media_chunk_tokens: 0            # 0 = atomic; >0 enables row-group split for oversized tables

hydration:
  enabled: false                       # answer-time image loading — off by default
  mode: conditional                    # off | conditional | always
  trigger_modalities: [figure, table, page_image]
  vision_provider: anthropic
  vision_model_name: claude-sonnet-5
  max_image_bytes: 5000000

artifact_store:
  backend: local                       # 'local' | 's3' (s3 stubbed)
  local_path: ./artifacts

evaluation:
  judge_provider: groq                 # 'groq' | 'ollama' | 'openai'
  judge_model: qwen/qwen3.6-27b        # strong reasoning for RAGAS eval metrics
  judge_base_url:                      # for ollama use http://localhost:11434/v1 ; ignored by groq
  judge_api_key:                       # ollama ignores this; OpenAI SDK needs a non-empty string (e.g. "ollama")
  max_context_chars: 3000              # truncate contexts before sending to judge (too small drops the supporting table row -> recall/faithfulness collapse; too large and one request alone can exceed a constrained tier's whole per-minute budget -> 413. override via RAG__EVALUATION__MAX_CONTEXT_CHARS)
  embeddings_model: sentence-transformers/all-MiniLM-L6-v2  # fallback if embedder not passed in
  judge_max_workers: 1                 # RAGAS's own concurrency (library default is 16 -- too many simultaneous jobs for a small TPM budget, causes mass TimeoutErrors)
  judge_max_retries: 15                # RAGAS's own retry count per job (library default is 10)
  judge_max_wait: 90                   # RAGAS's own max backoff between retries, seconds (library default is 60)
  judge_timeout_seconds: 900           # RAGAS's own per-job timeout, seconds (library default is 180 -- too short when workers=1 and a job waits its turn)
